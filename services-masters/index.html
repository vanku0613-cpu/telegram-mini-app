const view=document.getElementById('view'),title=document.getElementById('viewTitle'),hint=document.getElementById('viewHint'),viewIcon=document.getElementById('viewIcon'),tabs=[...document.querySelectorAll('[data-section]')],backButtons=[...document.querySelectorAll('[data-back]')];let section='services',category=null,depth='categories';

function contactList(people,desc){return `<div class="list">${people.map(p=>`<article class="contact"><h3>${p.name||'Контакт услуги'}</h3><p>${p.note||desc||'Уточните детали услуги при звонке.'}</p><div class="phones"><div class="phone-action"><a class="phone" href="tel:+380${p.phone.slice(1)}"><strong>+380 ${p.phone.slice(1,3)} ${p.phone.slice(3,6)} ${p.phone.slice(6,8)} ${p.phone.slice(8)}</strong><span>Позвонить</span></a><button type="button" class="favorite-toggle" data-favorite="" aria-pressed="false" aria-label="Добавить в избранное" title="Добавить в избранное">☆</button></div></div></article>`).join('')}</div>`}
