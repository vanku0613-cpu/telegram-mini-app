  <!-- =====================================================
       ВОССТАНОВЛЕНИЕ MINI APP ПОСЛЕ ВОЗВРАТА ИЗ TELEGRAM
       ===================================================== -->

  <script>

    (function () {

      "use strict";


      function prepareTelegramApp() {

        try {

          if (
            window.Telegram &&
            window.Telegram.WebApp
          ) {

            Telegram.WebApp.ready();

            Telegram.WebApp.expand();

          }

        } catch (error) {

          console.log(
            "Telegram WebApp restore error:",
            error
          );

        }

      }


      let wasHidden = false;


      document.addEventListener(
        "visibilitychange",
        function () {

          if (
            document.visibilityState === "hidden"
          ) {

            wasHidden = true;

            return;

          }


          if (
            document.visibilityState === "visible" &&
            wasHidden
          ) {

            wasHidden = false;


            setTimeout(
              function () {

                prepareTelegramApp();


                setTimeout(
                  function () {

                    const reference =
                      document.getElementById(
                        "reference"
                      );


                    const image =
                      document.getElementById(
                        "referenceImage"
                      );


                    if (
                      !reference ||
                      !image ||
                      !image.complete ||
                      image.naturalWidth === 0
                    ) {

                      window.location.reload();

                    }

                  },
                  700
                );

              },
              300
            );

          }

        }
      );


      window.addEventListener(
        "pageshow",
        function () {

          setTimeout(
            prepareTelegramApp,
            300
          );

        }
      );


      window.addEventListener(
        "focus",
        function () {

          setTimeout(
            prepareTelegramApp,
            300
          );

        }
      );


      prepareTelegramApp();

    })();

  </script>


  <!-- =====================================================
       СЧЁТЧИК ПРОСМОТРОВ
       ОБЩИЙ СЧЁТЧИК + ОГРАНИЧЕНИЕ 2 МИНУТЫ
       ===================================================== -->

  <script>

    (function () {

      "use strict";


      const COUNTER_KEY =
        "glavny_spravochnik_izmail_views_2026";

      const COUNTER_API =
        "https://countapi.mileshilliard.com/api/v1";

      const START_NUMBER = 5000;

      const VIEW_INTERVAL =
        2 * 60 * 1000;

      const LAST_VIEW_KEY =
        "izmail_last_view_time_v1";


      const numberElement =
        document.getElementById(
          "viewsNumber"
        );


      if (!numberElement) {

        return;

      }


      function showNumber(value) {

        const number =
          Number(value);


        if (
          Number.isFinite(number)
        ) {

          numberElement.textContent =
            number.toLocaleString("ru-RU");

        }

      }


      async function getCounter() {

        const response =
          await fetch(
            COUNTER_API +
            "/get/" +
            COUNTER_KEY +
            "?t=" +
            Date.now(),
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Counter GET error"
          );

        }


        return await response.json();

      }


      async function setCounter(value) {

        const response =
          await fetch(
            COUNTER_API +
            "/set/" +
            COUNTER_KEY +
            "?value=" +
            encodeURIComponent(value) +
            "&t=" +
            Date.now(),
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Counter SET error"
          );

        }


        return await response.json();

      }


      async function hitCounter() {

        const response =
          await fetch(
            COUNTER_API +
            "/hit/" +
            COUNTER_KEY +
            "?t=" +
            Date.now(),
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Counter HIT error"
          );

        }


        return await response.json();

      }


      async function updateViews() {

        try {

          const now =
            Date.now();

          const lastView =
            Number(
              localStorage.getItem(
                LAST_VIEW_KEY
              ) || "0"
            );


          /*
           * Если пользователь уже засчитывался
           * менее двух минут назад — просто
           * показываем текущее общее число.
           */

          if (
            lastView &&
            now - lastView < VIEW_INTERVAL
          ) {

            const current =
              await getCounter();

            showNumber(
              current.value
            );

            return;

          }


          /*
           * Получаем текущий общий счётчик.
           */

          let current;

          try {

            current =
              await getCounter();

          } catch (error) {

            /*
             * Если счётчика ещё нет,
             * создаём его с 5000.
             */

            current =
              await setCounter(
                START_NUMBER
              );

          }


          /*
           * Если значение почему-то меньше
           * стартового, приводим его к 5000.
           */

          if (
            Number(current.value) < START_NUMBER
          ) {

            current =
              await setCounter(
                START_NUMBER
              );

          }


          /*
           * Добавляем один просмотр.
           */

          const updated =
            await hitCounter();


          /*
           * Запоминаем время засчитанного
           * просмотра на этом устройстве.
           */

          localStorage.setItem(
            LAST_VIEW_KEY,
            String(now)
          );


          showNumber(
            updated.value
          );


        } catch (error) {

          console.log(
            "Views counter error:",
            error
          );


          /*
           * Если внешний сервис временно
           * недоступен — оставляем красивое
           * стартовое значение, ничего
           * остального на странице не ломаем.
           */

          showNumber(
            START_NUMBER
          );

        }

      }


      updateViews();

    })();

  </script>
