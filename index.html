<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#061a33">

<title>Главный справочник Измаил</title>

<link rel="stylesheet" href="styles.css?v=4">

</head>

<body>

<main class="screen" id="screen">

  <!-- НОВАЯ КАРТИНКА -->
  <img
    class="menu-image"
    src="file_00000000fb5482109371913b11c5aacd.png"
    alt="Главный справочник Измаил"
  >

  <!-- ГЛАВНЫЙ СПРАВОЧНИК -->
  <button
    class="hotspot whole"
    data-action="main"
    aria-label="Главный справочник Измаил">
  </button>

  <!-- Логотип -->
  <button
    class="hotspot logo"
    data-action="main"
    aria-label="Главный справочник Измаил">
  </button>

  <!-- ПОГОДА -->
  <button
    class="hotspot weather"
    data-action="weather"
    aria-label="Погода в Измаиле">
  </button>

  <!-- ВАЛЮТА -->
  <button
    class="hotspot currency"
    data-action="currency"
    aria-label="Курс валют USD EUR">
  </button>

  <!-- УКРЫТИЯ -->
  <button
    class="hotspot shelters"
    data-action="shelters"
    aria-label="Укрытия Измаил">
  </button>

  <!-- ПОИСК -->
  <button
    class="hotspot search-zone"
    data-action="search"
    aria-label="Поиск по справочнику">
  </button>

  <!-- ЗДОРОВЬЕ -->
  <button
    class="hotspot cat1"
    data-action="health"
    aria-label="Здоровье и уход">
  </button>

  <!-- ТРАНСПОРТ -->
  <button
    class="hotspot cat2"
    data-action="transport"
    aria-label="Транспорт и такси">
  </button>

  <!-- УСЛУГИ -->
  <button
    class="hotspot cat3"
    data-action="services"
    aria-label="Услуги и мастера">
  </button>

  <!-- ПРОДУКТЫ -->
  <button
    class="hotspot cat4"
    data-action="food"
    aria-label="Продукты питания">
  </button>

  <!-- КОММУНАЛЬНЫЕ -->
  <button
    class="hotspot cat5"
    data-action="utilities"
    aria-label="Коммунальные службы">
  </button>

  <!-- РАБОТА -->
  <button
    class="hotspot cat6"
    data-action="jobs"
    aria-label="Работа и вакансии">
  </button>

  <!-- ОБРАЗОВАНИЕ -->
  <button
    class="hotspot cat7"
    data-action="education"
    aria-label="Образование и развитие">
  </button>

  <!-- ОТДЫХ -->
  <button
    class="hotspot cat8"
    data-action="leisure"
    aria-label="Отдых, жильё, море">
  </button>

  <!-- НАШИ ГРУППЫ -->
  <button
    class="hotspot groups"
    data-action="groups"
    aria-label="Наши группы">
  </button>

  <!-- НИЖНЯЯ ПАНЕЛЬ -->

  <!-- Главная -->
  <button
    class="hotspot bottom-home"
    data-action="home"
    aria-label="Главная">
  </button>

  <!-- Заказать рекламу -->
  <button
    class="hotspot bottom-ad"
    data-action="instagram"
    aria-label="Заказать рекламу">
  </button>

  <!-- Избранное -->
  <button
    class="hotspot bottom-fav"
    data-action="favorites"
    aria-label="Избранное">
  </button>

  <!-- ДИНАМИЧЕСКИЕ ДАННЫЕ -->

  <div
    class="live-weather"
    id="liveWeather">
    —°
  </div>

  <div
    class="live-usd"
    id="liveUsd">
    —
  </div>

  <div
    class="live-eur"
    id="liveEur">
    —
  </div>

</main>

<!-- МОДАЛЬНОЕ ОКНО -->

<div
  class="modal hidden"
  id="modal">

  <div class="modal-box">

    <button
      class="close"
      id="close">
      ×
    </button>

    <h2 id="modalTitle"></h2>

    <div id="modalBody"></div>

  </div>

</div>

<!-- TELEGRAM -->

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- НАСТРОЙКИ -->

<script src="config.js?v=4"></script>

<!-- ОСНОВНОЙ JS -->

<script src="app.js?v=4"></script>

</body>
</html>
