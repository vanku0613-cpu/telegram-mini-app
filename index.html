<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#061b35">

  <title>Главный справочник Измаил</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <div class="reference" id="reference">

      <!--
        ВАЖНО:
        Этот PNG является основным дизайном.
        Он должен лежать рядом с index.html.
      -->
      <img
        id="referenceImage"
        class="reference-image"
        src="file_000000000628820a991aedd6c0479451.png"
        alt="Главный справочник Измаил"
      >


      <!-- =====================================================
           ПОГОДА + КУРС ВАЛЮТ
           ===================================================== -->

      <section
        class="live-widgets"
        aria-label="Погода и курс валют"
      >

        <!-- ПОГОДА ИЗМАИЛ -->
        <article class="widget weather-widget">

          <div class="widget-title">
            🌤️ ПОГОДА
          </div>

          <div
            id="weatherTemp"
            class="widget-main"
          >
            —°C
          </div>

          <div
            id="weatherText"
            class="widget-sub"
          >
            Загрузка…
          </div>

        </article>


        <!-- КУРС ВАЛЮТ -->
        <a
          id="currencyWidget"
          class="widget currency-widget"
          href="https://minfin.com.ua/currency/izmail/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Курс валют в Измаиле"
        >

          <div class="widget-title">
            💱 КУРС
          </div>

          <div class="currency-line">
            <b>USD</b>
            <span id="usdRate">—</span>
          </div>

          <div class="currency-line">
            <b>EUR</b>
            <span id="eurRate">—</span>
          </div>

          <div
            id="currencySource"
            class="widget-source"
          >
            НБУ · нажмите для курса Измаила
          </div>

        </a>

      </section>


      <!-- =====================================================
           ПРОЗРАЧНЫЕ КНОПКИ ПОВЕРХ ИСХОДНОЙ КАРТИНКИ
           ===================================================== -->

      <!-- Главный логотип -->
      <a
        id="mainGroup"
        class="hotspot logo-hotspot"
        href="#"
        aria-label="Главная группа"
      ></a>


      <!-- Укрытия -->
      <a
        id="shelterLink"
        class="hotspot shelter-hotspot"
        href="#"
        aria-label="Укрытия Измаил"
      ></a>


      <!-- Поиск -->
      <button
        id="searchHotspot"
        class="hotspot search-hotspot"
        type="button"
        aria-label="Поиск"
      ></button>


      <!-- Здоровье -->
      <a
        id="healthLink"
        class="hotspot category-hotspot health-hotspot"
        href="#"
        aria-label="Здоровье и уход"
      ></a>


      <!-- Транспорт -->
      <a
        id="transportLink"
        class="hotspot category-hotspot transport-hotspot"
        href="#"
        aria-label="Транспорт и такси"
      ></a>


      <!-- Услуги -->
      <a
        id="servicesLink"
        class="hotspot category-hotspot services-hotspot"
        href="#"
        aria-label="Услуги и мастера"
      ></a>


      <!-- Продукты -->
      <a
        id="foodLink"
        class="hotspot category-hotspot food-hotspot"
        href="#"
        aria-label="Продукты питания"
      ></a>


      <!-- Коммунальные -->
      <a
        id="utilitiesLink"
        class="hotspot category-hotspot utilities-hotspot"
        href="#"
        aria-label="Коммунальные службы"
      ></a>


      <!-- Работа -->
      <a
        id="jobsLink"
        class="hotspot category-hotspot jobs-hotspot"
        href="#"
        aria-label="Работа и вакансии"
      ></a>


      <!-- Образование -->
      <a
        id="educationLink"
        class="hotspot category-hotspot education-hotspot"
        href="#"
        aria-label="Образование и развитие"
      ></a>


      <!-- Отдых -->
      <a
        id="leisureLink"
        class="hotspot category-hotspot leisure-hotspot"
        href="#"
        aria-label="Отдых, жильё и море"
      ></a>


      <!-- Наши группы -->
      <a
        id="groupsLink"
        class="hotspot groups-hotspot"
        href="#"
        aria-label="Все наши Telegram-группы"
      ></a>


      <!-- =====================================================
           НИЖНЕЕ МЕНЮ
           ===================================================== -->

      <a
        id="homeLink"
        class="hotspot nav-hotspot home-hotspot"
        href="#"
        aria-label="Главная"
      ></a>


      <a
        id="adsLink"
        class="hotspot nav-hotspot ads-hotspot"
        href="#"
        aria-label="Заказать рекламу"
      ></a>


      <a
        id="favoritesLink"
        class="hotspot nav-hotspot favorites-hotspot"
        href="#"
        aria-label="Избранное"
      ></a>

    </div>

  </main>


  <script src="script.js"></script>

</body>
</html>
