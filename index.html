<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#061a33">
<title>Главный справочник Измаил</title>

<link rel="stylesheet" href="styles.css?v=2">
</head>

<body>

<main class="screen" id="screen">

  <img
    class="menu-image"
    src="menu.png?v=2"
    alt="Главный справочник Измаил"
  >

  <!-- Вся картинка -->
  <button
    class="hotspot whole"
    data-action="main"
    aria-label="Главный справочник Измаил">
  </button>

  <!-- Верх -->
  <button
    class="hotspot logo"
    data-action="main"
    aria-label="Главный справочник Измаил">
  </button>

  <button
    class="hotspot weather"
    data-action="weather"
    aria-label="Погода в Измаиле">
  </button>

  <button
    class="hotspot currency"
    data-action="currency"
    aria-label="Курс валют USD EUR">
  </button>

  <button
    class="hotspot shelters"
    data-action="shelters"
    aria-label="Укрытия Измаил">
  </button>

  <!-- Поиск -->
  <button
    class="hotspot search-zone"
    data-action="search"
    aria-label="Поиск по справочнику">
  </button>

  <!-- Категории -->
  <button
    class="hotspot cat1"
    data-action="health"
    aria-label="Здоровье и уход">
  </button>

  <button
    class="hotspot cat2"
    data-action="transport"
    aria-label="Транспорт и такси">
  </button>

  <button
    class="hotspot cat3"
    data-action="services"
    aria-label="Услуги и мастера">
  </button>

  <button
    class="hotspot cat4"
    data-action="food"
    aria-label="Продукты питания">
  </button>

  <button
    class="hotspot cat5"
    data-action="utilities"
    aria-label="Коммунальные службы">
  </button>

  <button
    class="hotspot cat6"
    data-action="jobs"
    aria-label="Работа и вакансии">
  </button>

  <button
    class="hotspot cat7"
    data-action="education"
    aria-label="Образование и развитие">
  </button>

  <button
    class="hotspot cat8"
    data-action="leisure"
    aria-label="Отдых, жильё, море">
  </button>

  <!-- Наши группы -->
  <button
    class="hotspot groups"
    data-action="groups"
    aria-label="Наши группы">
  </button>

  <!-- Нижняя строка -->
  <button
    class="hotspot bottom-home"
    data-action="home"
    aria-label="Главная">
  </button>

  <button
    class="hotspot bottom-ad"
    data-action="instagram"
    aria-label="Заказать рекламу">
  </button>

  <button
    class="hotspot bottom-fav"
    data-action="favorites"
    aria-label="Избранное">
  </button>

  <!-- Динамические данные -->
  <div
    class="live-weather"
    id="liveWeather">
    —°
  </div>

  <div
    class="live-usd"
    id="liveUsd">
    —
  </div>

  <div
    class="live-eur"
    id="liveEur">
    —
  </div>

</main>

<!-- Окно -->
<div
  class="modal hidden"
  id="modal">

  <div class="modal-box">

    <button
      class="close"
      id="close">
      ×
    </button>

    <h2 id="modalTitle"></h2>

    <div id="modalBody"></div>

  </div>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js?v=2"></script>
<script src="app.js?v=2"></script>

</body>
</html>
