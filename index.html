<!doctype html>
<html lang="ru">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#061b35"
  >

  <title>Главный справочник Измаил</title>

  <link
    rel="stylesheet"
    href="./styles.css"
  >

</head>


<body>

  <main class="app">

    <section class="reference">

      <!-- =================================================
           ГЛАВНОЕ ИЗОБРАЖЕНИЕ
           ================================================= -->

      <img
        id="referenceImage"
        class="reference-image"
        src="./file_00000000535c820a8555793262fd3bdf.png"
        alt="Главный справочник Измаил"
        loading="eager"
        decoding="sync"
        draggable="false"
      >


      <!-- =================================================
           ПОГОДА + КУРС ВАЛЮТ + УКРЫТИЕ
           ================================================= -->

      <div class="live-widgets">

        <!-- ПОГОДА -->

        <a
          id="weatherWidget"
          class="widget weather-widget"
          href="#"
          aria-label="Погода Измаил"
        >

          <span class="weather-icon">
            ☀️
          </span>

          <span class="widget-content">

            <span class="widget-title">
              ПОГОДА ИЗМАИЛА
            </span>

            <span
              id="weatherTemp"
              class="widget-main"
            >
              —°C
            </span>

            <span
              id="weatherText"
              class="widget-sub"
            >
              Загрузка...
            </span>

          </span>

          <span
            id="visitCounter"
            aria-hidden="true"
          >

            <span id="visitCounterIcon">
              👁
            </span>

            <span id="visitCounterNumber">
              0
            </span>

          </span>

        </a>


        <!-- КУРС ВАЛЮТ -->

        <div
          id="currencyWidget"
          class="widget currency-widget"
        >

          <span class="widget-title">
            КУРС ВАЛЮТ
          </span>

          <span class="currency-content">

            <span class="currency-line">

              <b>
                💵 USD
              </b>

              <span id="usdRate">
                —
              </span>

            </span>

            <span class="currency-line">

              <b>
                💶 EUR
              </b>

              <span id="eurRate">
                —
              </span>

            </span>

            <span class="widget-source">
              НБУ
            </span>

          </span>

        </div>


        <!-- УКРЫТИЕ -->

        <a
          id="shelterLink"
          class="widget shelter-widget"
          href="#"
          aria-label="Укрытие Измаил"
        >

          <span class="shelter-title">

            <span class="shelter-title-icon">
              🛡️
            </span>

            <span>
              УКРЫТИЕ ИЗМАИЛ
            </span>

          </span>

        </a>

      </div>


      <!-- =================================================
           ЛОГОТИП / ГЛАВНАЯ ГРУППА
           ================================================= -->

      <a
        id="mainGroup"
        class="hotspot logo-hotspot"
        href="#"
        aria-label="Главный справочник Измаил"
      ></a>


      <!-- =================================================
           ПОИСК
           ================================================= -->

      <div
        id="searchHotspot"
        class="hotspot search-hotspot"
        role="button"
        tabindex="0"
        aria-label="Поиск по справочнику"
      >

        <input
          id="directorySearchInput"
          type="search"
          autocomplete="off"
          inputmode="search"
          aria-label="Поиск по справочнику"
          tabindex="-1"
        >

      </div>


      <!-- =================================================
           КАТЕГОРИИ
           ================================================= -->

      <a
        id="healthLink"
        class="hotspot category-hotspot health-hotspot"
        href="#"
        aria-label="Здоровье и уход"
      ></a>

      <a
        id="transportLink"
        class="hotspot category-hotspot transport-hotspot"
        href="#"
        aria-label="Транспорт / Такси"
      ></a>

      <a
        id="servicesLink"
        class="hotspot category-hotspot services-hotspot"
        href="#"
        aria-label="Услуги и мастера"
      ></a>

      <a
        id="foodLink"
        class="hotspot category-hotspot food-hotspot"
        href="#"
        aria-label="Продукты питания"
      ></a>

      <a
        id="utilitiesLink"
        class="hotspot category-hotspot utilities-hotspot"
        href="#"
        aria-label="Коммунальные службы"
      ></a>

      <a
        id="jobsLink"
        class="hotspot category-hotspot jobs-hotspot"
        href="#"
        aria-label="Работа / Вакансии"
      ></a>

      <a
        id="educationLink"
        class="hotspot category-hotspot education-hotspot"
        href="#"
        aria-label="Образование и развитие"
      ></a>

      <a
        id="leisureLink"
        class="hotspot category-hotspot leisure-hotspot"
        href="#"
        aria-label="Отдых • Жильё • Море"
      ></a>


      <!-- =================================================
           НАШИ ГРУППЫ
           ================================================= -->

      <a
        id="groupsLink"
        class="hotspot groups-hotspot"
        href="#"
        aria-label="Наши группы"
      ></a>


      <!-- =================================================
           НИЖНЕЕ МЕНЮ
           ================================================= -->

      <a
        id="homeLink"
        class="hotspot nav-hotspot home-hotspot"
        href="#"
        aria-label="Главная"
      ></a>

      <a
        id="adsLink"
        class="hotspot nav-hotspot ads-hotspot"
        href="#"
        aria-label="Реклама"
      ></a>

      <a
        id="favoritesLink"
        class="hotspot nav-hotspot favorites-hotspot"
        href="#"
        aria-label="Избранное"
      ></a>

    </section>

  </main>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script src="./config.js"></script>

  <script src="./app.js"></script>


  <!-- =====================================================
       ЛОКАЛЬНЫЙ СЧЁТЧИК ПОСЕЩЕНИЙ
       ===================================================== -->

  <script>

    (function () {

      "use strict";

      const counterKey =
        "izmail_local_visit_counter";

      const intervalKey =
        "izmail_local_visit_last";

      const INTERVAL =
        2 * 60 * 1000;

      const numberElement =
        document.getElementById(
          "visitCounterNumber"
        );

      if (!numberElement) {
        return;
      }

      let count = 0;
      let lastVisit = 0;

      try {

        count =
          Number(
            localStorage.getItem(
              counterKey
            ) || "0"
          );

        lastVisit =
          Number(
            localStorage.getItem(
              intervalKey
            ) || "0"
          );

      } catch (e) {}

      const now =
        Date.now();

      if (
        !Number.isFinite(count) ||
        count < 0
      ) {
        count = 0;
      }

      if (
        !Number.isFinite(lastVisit)
      ) {
        lastVisit = 0;
      }

      if (
        now - lastVisit >=
        INTERVAL
      ) {

        count += 1;

        try {

          localStorage.setItem(
            counterKey,
            String(count)
          );

          localStorage.setItem(
            intervalKey,
            String(now)
          );

        } catch (e) {}

      }

      numberElement.textContent =
        String(count);

    })();

  </script>

</body>

</html>
