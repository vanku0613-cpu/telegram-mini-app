<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <meta name="theme-color" content="#061b35">
  <title>Главный справочник Измаил</title>

  <link rel="stylesheet" href="./styles.css">

  <style>
    /* ===== ВСТРОЕННОЕ НЕОНОВОЕ МЕНЮ ===== */
    #groupsMenuFrame {
      position: absolute !important;
      z-index: 20 !important;
      left: 0 !important;
      top: 34.45% !important;
      width: 100% !important;
      height: 65.55% !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      background: transparent !important;
      display: block !important;
      pointer-events: none !important;
      overflow: hidden !important;
    }

    /* Невидимые зоны остаются поверх меню и не меняют его дизайн. */
    .hotspot {
      z-index: 30 !important;
    }

    /* ===== СЧЁТЧИК ПРОСМОТРОВ НАД НАЧАЛОМ ПОГОДЫ ===== */

    #weatherWidget {
      position: relative !important;
      overflow: visible !important;
    }

    #visitCounter {
      position: absolute !important;
      z-index: 9999 !important;
      left: 8px !important;
      top: -27px !important;
      transform: none !important;
      display: flex !important;
      align-items: center !important;
      justify-content: flex-start !important;
      gap: 4px !important;
      height: 21px !important;
      padding: 0 8px !important;
      border-radius: 11px !important;
      background: rgba(5, 20, 42, 0.72) !important;
      border: 1px solid rgba(255,255,255,0.18) !important;
      box-shadow:
        0 3px 10px rgba(0,0,0,0.22),
        inset 0 0 8px rgba(255,255,255,0.04) !important;
      color: rgba(255,255,255,0.95) !important;
      font-family: Arial, Helvetica, sans-serif !important;
      font-size: 9px !important;
      font-weight: 700 !important;
      line-height: 21px !important;
      white-space: nowrap !important;
      pointer-events: none !important;
      box-sizing: border-box !important;
    }

    #visitCounterIcon {
      font-size: 11px !important;
      line-height: 1 !important;
      opacity: .95 !important;
      flex-shrink: 0 !important;
    }

    #visitCounterNumber {
      font-size: 9px !important;
      line-height: 1 !important;
      font-variant-numeric: tabular-nums !important;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="reference" id="reference">

      <!-- ОСНОВНАЯ КАРТИНКА ИНТЕРФЕЙСА -->

      <img
        id="referenceImage"
        class="reference-image"
        src="./file_00000000535c820a8555793262fd3bdf.png?v=2"
        alt="Главный справочник Измаил"
        loading="eager"
        decoding="sync"
        draggable="false"
      >

      <!-- ГОТОВОЕ НЕОНОВОЕ МЕНЮ: встроено прямо поверх изображения -->
      <iframe
        id="groupsMenuFrame"
        title="Меню справочника"
        src="./изображения%20меню/groups-menu-complete-6.html"
        loading="eager"
        scrolling="no"
        frameborder="0"
        aria-hidden="false"
      ></iframe>

      <section
        class="live-widgets"
        aria-label="Погода и курс валют"
      >

        <!-- ПОГОДА -->
        <div
          id="weatherWidget"
          class="widget weather-widget"
        >

          <!-- СЧЁТЧИК ПРОСМОТРОВ -->
          <div
            id="visitCounter"
            aria-label="Количество просмотров"
          >
            <span id="visitCounterIcon">👁</span>
            <span>просмотрено</span>
            <span id="visitCounterNumber">1</span>
          </div>

          <div class="widget-title">
            ПОГОДА
          </div>

          <div
            id="weatherTemp"
            class="widget-main"
          >
            —°C
          </div>

          <div
            id="weatherText"
            class="widget-sub"
          >
            Загрузка…
          </div>

        </div>

        <!-- КУРС ВАЛЮТ -->
        <a
          id="currencyWidget"
          class="widget currency-widget"
          href="https://minfin.com.ua/currency/izmail/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Курс валют"
        >

          <div class="widget-title">
            КУРС НБУ
          </div>

          <div class="currency-line">
            <b>USD</b>
            <span id="usdRate">—</span>
          </div>

          <div class="currency-line">
            <b>EUR</b>
            <span id="eurRate">—</span>
          </div>

        </a>

      </section>

      <!-- ГЛАВНАЯ ГРУППА -->
      <a
        id="mainGroup"
        class="hotspot logo-hotspot"
        href="#"
        aria-label="Главная группа"
      ></a>

      <!-- УКРЫТИЯ -->
      <a
        id="shelterLink"
        class="hotspot shelter-hotspot"
        href="#"
        aria-label="Укрытия Измаил"
      ></a>

      <!-- ПОИСК -->
      <div
        id="searchHotspot"
        class="hotspot search-hotspot"
        role="search"
        aria-label="Поиск по справочнику"
      >

        <input
          id="directorySearchInput"
          class="directory-search-input"
          type="search"
          name="directory-search"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="sentences"
          spellcheck="false"
          inputmode="search"
          enterkeyhint="search"
          aria-label="Поиск по справочнику Измаил"
          style="
            position:absolute!important;
            z-index:10!important;
            left:0!important;
            top:0!important;
            width:100%!important;
            height:100%!important;
            display:block!important;
            margin:0!important;
            padding:0 13.5%!important;
            background:transparent!important;
            background-color:transparent!important;
            background-image:none!important;
            border:0!important;
            border-width:0!important;
            border-style:none!important;
            outline:0!important;
            outline-width:0!important;
            box-shadow:none!important;
            color:#ffffff!important;
            font-family:Arial,Helvetica,sans-serif!important;
            font-size:clamp(12px,2.5vw,18px)!important;
            font-weight:700!important;
            line-height:1!important;
            text-align:left!important;
            border-radius:18px!important;
            appearance:none!important;
            -webkit-appearance:none!important;
            -webkit-tap-highlight-color:transparent!important;
            caret-color:#ffffff!important;
          "
        >

      </div>

      <!-- КАТЕГОРИИ -->

      <a id="healthLink" class="hotspot category-hotspot health-hotspot" href="#" aria-label="Здоровье и уход"></a>
      <a id="transportLink" class="hotspot category-hotspot transport-hotspot" href="#" aria-label="Транспорт и такси"></a>
      <a id="servicesLink" class="hotspot category-hotspot services-hotspot" href="#" aria-label="Услуги и мастера"></a>
      <a id="foodLink" class="hotspot category-hotspot food-hotspot" href="#" aria-label="Продукты питания"></a>
      <a id="utilitiesLink" class="hotspot category-hotspot utilities-hotspot" href="#" aria-label="Коммунальные службы"></a>
      <a id="jobsLink" class="hotspot category-hotspot jobs-hotspot" href="#" aria-label="Работа и вакансии"></a>
      <a id="educationLink" class="hotspot category-hotspot education-hotspot" href="#" aria-label="Образование и развитие"></a>
      <a id="leisureLink" class="hotspot category-hotspot leisure-hotspot" href="#" aria-label="Отдых, жильё и море"></a>

      <!-- НАШИ ГРУППЫ -->
      <a id="groupsLink" class="hotspot groups-hotspot" href="#" aria-label="Наши группы"></a>

      <!-- НИЖНЯЯ НАВИГАЦИЯ -->

      <a id="homeLink" class="hotspot nav-hotspot home-hotspot" href="#" aria-label="Главная"></a>

      <a
        id="adsLink"
        class="hotspot nav-hotspot ads-hotspot"
        href="https://t.me/Vanku13"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Заказать рекламу"
      ></a>

      <a id="favoritesLink" class="hotspot nav-hotspot favorites-hotspot" href="#" aria-label="Избранное"></a>

      <!-- ПОЛЬЗОВАТЕЛЬСКОЕ СОГЛАШЕНИЕ -->

      <a
        class="user-agreement"
        href="#"
        aria-label="Пользовательское соглашение"
      >
        Пользовательское соглашение
      </a>

    </div>
  </main>

  <!-- ЛОКАЛЬНЫЙ СЧЁТЧИК -->

  <script>
    (() => {

      const COUNT_KEY =
        "izmail_local_visit_counter";

      const TIME_KEY =
        "izmail_local_visit_time";

      const VISIT_INTERVAL =
        2 * 60 * 1000;

      try {

        let count = parseInt(
          localStorage.getItem(COUNT_KEY) || "0",
          10
        );

        if (
          !Number.isFinite(count) ||
          count < 0
        ) {
          count = 0;
        }

        const now = Date.now();

        const lastVisit = parseInt(
          localStorage.getItem(TIME_KEY) || "0",
          10
        );

        if (
          !lastVisit ||
          (now - lastVisit) >= VISIT_INTERVAL
        ) {

          count += 1;

          localStorage.setItem(
            COUNT_KEY,
            String(count)
          );

          localStorage.setItem(
            TIME_KEY,
            String(now)
          );
        }

        const counter =
          document.getElementById(
            "visitCounterNumber"
          );

        if (counter) {

          counter.textContent =
            count.toLocaleString("ru-RU");

        }

      } catch (error) {

        const counter =
          document.getElementById(
            "visitCounterNumber"
          );

        if (counter) {
          counter.textContent = "1";
        }

      }

    })();
  </script>

  <!-- ОСНОВНЫЕ СКРИПТЫ -->

  <script src="./config.js"></script>
  <script src="./app.js"></script>

  <!-- СВЯЗЬ НЕВИДИМЫХ ЗОН С КРАСИВЫМИ КНОПКАМИ МЕНЮ -->
  <script>
    (() => {
      const frame = document.getElementById("groupsMenuFrame");
      const reference = document.getElementById("reference");
      if (!frame || !reference) return;

      const map = {
        searchHotspot: [".search", ".app-search", ".directory-search"],
        healthLink: [".category-card:nth-of-type(1)", ".group-card:nth-of-type(1)", ".category-button:nth-of-type(1)"],
        transportLink: [".category-card:nth-of-type(2)", ".group-card:nth-of-type(2)", ".category-button:nth-of-type(2)"],
        servicesLink: [".category-card:nth-of-type(3)", ".group-card:nth-of-type(3)", ".category-button:nth-of-type(3)"],
        foodLink: [".category-card:nth-of-type(4)", ".group-card:nth-of-type(4)", ".category-button:nth-of-type(4)"],
        utilitiesLink: [".category-card:nth-of-type(5)", ".group-card:nth-of-type(5)", ".category-button:nth-of-type(5)"],
        jobsLink: [".category-card:nth-of-type(6)", ".group-card:nth-of-type(6)", ".category-button:nth-of-type(6)"],
        educationLink: [".category-card:nth-of-type(7)", ".group-card:nth-of-type(7)", ".category-button:nth-of-type(7)"],
        leisureLink: [".category-card:nth-of-type(8)", ".group-card:nth-of-type(8)", ".category-button:nth-of-type(8)"],
        groupsLink: [".groups", ".all-groups", ".groups-button"],
        homeLink: [".bottom .bottom-button:nth-of-type(1)", ".bottom-nav .bottom-button:nth-of-type(1)", ".bottom-nav button:nth-of-type(1)"],
        adsLink: [".bottom .bottom-button:nth-of-type(2)", ".bottom-nav .bottom-button:nth-of-type(2)", ".bottom-nav button:nth-of-type(2)"],
        favoritesLink: [".bottom .bottom-button:nth-of-type(3)", ".bottom-nav .bottom-button:nth-of-type(3)", ".bottom-nav button:nth-of-type(3)"]
      };

      function menuDocument() {
        try {
          return frame.contentDocument || frame.contentWindow.document;
        } catch (e) {
          return null;
        }
      }

      function firstTarget(doc, selectors) {
        if (!doc) return null;

        for (const selector of selectors) {
          try {
            const el = doc.querySelector(selector);
            if (el) return el;
          } catch (e) {}
        }

        return null;
      }

      function installMenuAnimation(doc) {
        if (!doc || doc.getElementById("parentProxyMenuStyle")) return;

        const style = doc.createElement("style");

        style.id = "parentProxyMenuStyle";

        style.textContent = `
          @keyframes parentProxyMenuFlash {
            0% {
              transform:scale(1);
              filter:brightness(1);
            }

            18% {
              transform:scale(.985);
              filter:brightness(1.55);
            }

            38% {
              transform:scale(1);
              filter:brightness(1.15);
            }

            55% {
              filter:brightness(1.55);
            }

            100% {
              transform:scale(1);
              filter:brightness(1);
            }
          }

          .parent-proxy-menu-flash {
            animation:parentProxyMenuFlash .42s ease !important;
          }
        `;

        (doc.head || doc.documentElement).appendChild(style);
      }

      function flashMenu(id) {
        const doc = menuDocument();
        const target = firstTarget(doc, map[id] || []);

        if (!target) return;

        installMenuAnimation(doc);

        target.classList.remove("parent-proxy-menu-flash");

        void target.offsetWidth;

        target.classList.add("parent-proxy-menu-flash");

        setTimeout(
          () => target.classList.remove("parent-proxy-menu-flash"),
          500
        );
      }

      function alignHotspots() {
        const doc = menuDocument();

        if (!doc) return;

        const refRect =
          reference.getBoundingClientRect();

        const frameRect =
          frame.getBoundingClientRect();

        if (
          !refRect.width ||
          !frameRect.width
        ) return;

        const scaleX =
          frameRect.width /
          (frame.offsetWidth || frameRect.width);

        const scaleY =
          frameRect.height /
          (frame.offsetHeight || frameRect.height);

        Object.entries(map).forEach(
          ([id, selectors]) => {

            const hotspot =
              document.getElementById(id);

            const target =
              firstTarget(doc, selectors);

            if (!hotspot || !target) return;

            const r =
              target.getBoundingClientRect();

            const left =
              frameRect.left -
              refRect.left +
              r.left * scaleX;

            const top =
              frameRect.top -
              refRect.top +
              r.top * scaleY;

            const width =
              r.width * scaleX;

            const height =
              r.height * scaleY;

            hotspot.style.left =
              left + "px";

            hotspot.style.top =
              top + "px";

            hotspot.style.width =
              width + "px";

            hotspot.style.height =
              height + "px";
          }
        );
      }

      function syncSearch() {
        const parentInput =
          document.getElementById(
            "directorySearchInput"
          );

        const doc =
          menuDocument();

        if (!parentInput || !doc) return;

        const menuInput =
          firstTarget(
            doc,
            [
              ".search input",
              ".app-search input",
              ".directory-search input",
              "#q",
              "#directorySearchInput"
            ]
          );

        if (!menuInput) return;

        menuInput.value =
          parentInput.value;

        try {
          menuInput.dispatchEvent(
            new Event(
              "input",
              {
                bubbles: true
              }
            )
          );
        } catch (e) {}
      }

      frame.addEventListener(
        "load",
        () => {

          const doc =
            menuDocument();

          if (!doc) return;

          try {

            const header =
              doc.querySelector(
                ".profile-header"
              );

            if (header) {
              header.style.display =
                "none";
            }

            if (doc.body) {

              doc.body.style.margin =
                "0";

              doc.body.style.overflow =
                "hidden";
            }

          } catch (e) {}

          installMenuAnimation(doc);

          setTimeout(
            alignHotspots,
            50
          );

          setTimeout(
            alignHotspots,
            250
          );

          setTimeout(
            alignHotspots,
            700
          );

        }
      );

      Object.keys(map).forEach(
        (id) => {

          const hotspot =
            document.getElementById(id);

          if (!hotspot) return;

          hotspot.addEventListener(
            "pointerdown",
            () => flashMenu(id),
            true
          );

          hotspot.addEventListener(
            "touchstart",
            () => flashMenu(id),
            {
              capture: true,
              passive: true
            }
          );

        }
      );

      const parentSearch =
        document.getElementById(
          "directorySearchInput"
        );

      if (parentSearch) {

        parentSearch.addEventListener(
          "input",
          syncSearch
        );

        parentSearch.addEventListener(
          "focus",
          syncSearch
        );

      }

      window.addEventListener(
        "resize",
        alignHotspots
      );

      window.addEventListener(
        "orientationchange",
        () =>
          setTimeout(
            alignHotspots,
            150
          )
      );

    })();
  </script>

</body>
</html>
