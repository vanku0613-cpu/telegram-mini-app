<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#061b35">

  <title>Главный справочник Измаил</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="app">

    <div class="reference" id="reference">

      <!-- =====================================================
           ОСНОВНАЯ КАРТИНКА
           ===================================================== -->

      <img
        id="referenceImage"
        class="reference-image"
        src="file_000000000628820a991aedd6c0479451.png"
        alt="Главный справочник Измаил"
      >


      <!-- =====================================================
           ВЕРХНИЕ СТЕКЛЯННЫЕ КНОПКИ
           ПОГОДА / КУРС / УКРЫТИЯ
           ===================================================== -->

      <section
        class="live-widgets"
        aria-label="Погода, курс валют и укрытия"
      >

        <!-- ПОГОДА -->
        <button
          id="weatherWidget"
          class="glass-button live-widget weather-widget"
          type="button"
          aria-label="Погода в Измаиле"
        >

          <span
            class="live-icon"
            aria-hidden="true"
          >🌤️</span>

          <span class="live-content">

            <span class="live-title">
              ПОГОДА
            </span>

            <span
              id="weatherTemp"
              class="live-main"
            >
              —°C
            </span>

            <span
              id="weatherText"
              class="live-sub"
            >
              Загрузка…
            </span>

          </span>

        </button>


        <!-- КУРС ВАЛЮТ -->
        <a
          id="currencyWidget"
          class="glass-button live-widget currency-widget"
          href="https://minfin.com.ua/currency/izmail/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Курс валют в Измаиле"
        >

          <span
            class="live-icon"
            aria-hidden="true"
          >💱</span>

          <span class="live-content">

            <span class="live-title">
              КУРС НБУ
            </span>

            <span class="currency-values">

              <span class="currency-line">
                <b>USD</b>
                <span id="usdRate">—</span>
              </span>

              <span class="currency-line">
                <b>EUR</b>
                <span id="eurRate">—</span>
              </span>

            </span>

          </span>

        </a>


        <!-- УКРЫТИЯ -->
        <a
          id="shelterWidget"
          class="glass-button live-widget shelter-widget"
          href="#"
          aria-label="Укрытия Измаил"
        >

          <span
            class="live-icon"
            aria-hidden="true"
          >🛡️</span>

          <span class="live-content">

            <span class="live-title">
              УКРЫТИЯ
            </span>

            <span class="live-main shelter-main">
              Измаил
            </span>

            <span class="live-sub">
              Нажмите для карты
            </span>

          </span>

        </a>

      </section>


      <!-- =====================================================
           ЛОГОТИП / ГЛАВНАЯ ГРУППА
           ===================================================== -->

      <a
        id="mainGroup"
        class="hotspot glass-hotspot logo-hotspot"
        href="#"
        aria-label="Главная группа"
      ></a>


      <!-- =====================================================
           ПОИСК
           ===================================================== -->

      <button
        id="searchHotspot"
        class="hotspot glass-hotspot search-hotspot"
        type="button"
        aria-label="Поиск"
      ></button>


      <!-- =====================================================
           КАТЕГОРИИ
           ===================================================== -->

      <a
        id="healthLink"
        class="hotspot glass-hotspot category-hotspot health-hotspot"
        href="#"
        aria-label="Здоровье и уход"
      ></a>

      <a
        id="transportLink"
        class="hotspot glass-hotspot category-hotspot transport-hotspot"
        href="#"
        aria-label="Транспорт и такси"
      ></a>

      <a
        id="servicesLink"
        class="hotspot glass-hotspot category-hotspot services-hotspot"
        href="#"
        aria-label="Услуги и мастера"
      ></a>

      <a
        id="foodLink"
        class="hotspot glass-hotspot category-hotspot food-hotspot"
        href="#"
        aria-label="Продукты питания"
      ></a>

      <a
        id="utilitiesLink"
        class="hotspot glass-hotspot category-hotspot utilities-hotspot"
        href="#"
        aria-label="Коммунальные службы"
      ></a>

      <a
        id="jobsLink"
        class="hotspot glass-hotspot category-hotspot jobs-hotspot"
        href="#"
        aria-label="Работа и вакансии"
      ></a>

      <a
        id="educationLink"
        class="hotspot glass-hotspot category-hotspot education-hotspot"
        href="#"
        aria-label="Образование и развитие"
      ></a>

      <a
        id="leisureLink"
        class="hotspot glass-hotspot category-hotspot leisure-hotspot"
        href="#"
        aria-label="Отдых, жильё и море"
      ></a>


      <!-- =====================================================
           НАШИ ГРУППЫ
           ===================================================== -->

      <a
        id="groupsLink"
        class="hotspot glass-hotspot groups-hotspot"
        href="#"
        aria-label="Все наши Telegram-группы"
      ></a>


      <!-- =====================================================
           НИЖНЕЕ МЕНЮ
           ===================================================== -->

      <a
        id="homeLink"
        class="hotspot glass-hotspot nav-hotspot home-hotspot"
        href="#"
        aria-label="Главная"
      ></a>

      <a
        id="adsLink"
        class="hotspot glass-hotspot nav-hotspot ads-hotspot"
        href="#"
        aria-label="Заказать рекламу"
      ></a>

      <a
        id="favoritesLink"
        class="hotspot glass-hotspot nav-hotspot favorites-hotspot"
        href="#"
        aria-label="Избранное"
      ></a>

    </div>

  </main>


  <!-- ВАЖНО:
       Сначала config.js, потом app.js -->
  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
