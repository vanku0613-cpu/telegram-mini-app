    /* =====================================================
       БЛОКИ ПОГОДЫ И КУРСА ВАЛЮТ
       ===================================================== */

    .live-widgets {
      position: absolute;

      z-index: 20;

      left: 6%;

      /* Блоки опущены ниже */
      top: 31.8%;

      width: 88%;

      /* Увеличенная высота */
      height: 7.5%;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 2%;
    }


    /* =====================================================
       ПОГОДА
       ===================================================== */

    #weatherWidget {
      position: relative !important;

      min-height: 100%;

      height: 100%;

      box-sizing: border-box;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: flex-start;

      padding: 7px 10px !important;

      overflow: visible !important;

      border-radius: 12px;

      background-image:
        linear-gradient(
          90deg,
          rgba(3,18,38,0.84),
          rgba(3,18,38,0.48),
          rgba(3,18,38,0.25)
        ),
        url("https://upload.wikimedia.org/wikipedia/commons/d/db/City-beach-Izmail-a-1.jpg") !important;

      background-position:
        center center !important;

      background-size:
        cover !important;

      background-repeat:
        no-repeat !important;

      border:
        1px solid rgba(255,255,255,0.25) !important;

      box-shadow:
        0 4px 14px rgba(0,0,0,0.35),
        inset 0 0 18px rgba(255,255,255,0.05) !important;

      color:
        #ffffff !important;
    }


    /* Затемнение */

    #weatherWidget::after {
      content: "";

      position: absolute;

      inset: 0;

      z-index: 0;

      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,0.12),
          rgba(0,0,0,0.02)
        );

      border-radius:
        inherit;
    }


    /* =====================================================
       ЗАГОЛОВОК ПОГОДЫ
       ===================================================== */

    #weatherWidget .widget-title {
      position: relative;

      z-index: 2;

      margin:
        0 0 4px 11px !important;

      padding: 0 !important;

      font-family:
        Arial,
        Helvetica,
        sans-serif !important;

      font-size:
        clamp(9px, 1.9vw, 12px) !important;

      font-weight:
        900 !important;

      line-height:
        1.05 !important;

      letter-spacing:
        0.35px !important;

      color:
        #ffffff !important;

      text-shadow:
        0 1px 4px rgba(0,0,0,0.75) !important;

      white-space:
        nowrap !important;
    }


    /* =====================================================
       ТЕМПЕРАТУРА
       ===================================================== */

      padding: 0 !important;

      font-family:
        Arial,
        Helvetica,
        sans-serif !important;

      font-size:
        clamp(15px, 3.2vw, 21px) !important;

      font-weight:
        900 !important;

      line-height:
        1 !important;

      color:
        #ffffff !important;

      text-shadow:
        0 1px 5px rgba(0,0,0,0.8) !important;
    }
