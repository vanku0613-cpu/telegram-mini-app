<script>
(()=>{
  const typeMenu=document.getElementById('typeMenu'),routeMenu=document.getElementById('routeMenu'),routeDetail=document.getElementById('routeDetail'),types=document.getElementById('types'),routesGrid=document.getElementById('routes'),routeMenuTitle=document.getElementById('routeMenuTitle'),routeCount=document.getElementById('routeCount'),routeHint=document.getElementById('routeHint'),backToTypes=document.getElementById('backToTypes'),backToRoutes=document.getElementById('backToRoutes'),sectionBacks=[...document.querySelectorAll('[data-schedule-back]')],loading=document.getElementById('loading'),content=document.getElementById('routeContent'),routeTitle=document.getElementById('routeTitle'),routeMeta=document.getElementById('routeMeta'),fare=document.getElementById('fare'),directions=document.getElementById('directions'),viewTabs=document.getElementById('viewTabs'),schedulePanel=document.getElementById('schedulePanel'),mapView=document.getElementById('mapView'),stopsView=document.getElementById('stopsView'),cityTitle=document.getElementById('cityTitle'),citySubtitle=document.getElementById('citySubtitle'),menuTitle=document.getElementById('menuTitle'),cityCoverImage=document.getElementById('cityCoverImage');

  const villagePhotos={'Сафьяны':'safiany','Матроска':'matroska','Ларжанка':'larzhanka','Броска':'broska','Лощиновка':'loshchynivka','Новая Некрасовка':'nova-nekrasivka','Старая Некрасовка':'stara-nekrasivka','Кислица':'kyslytsia','Муравлёвка':'muravlivka','Озёрное':'ozerne','Богатое':'bohate','Утконосовка':'utkonosivka','Криничное':'krynychne','Дунайское':'dunaiske','Первомайское':'pershotravneve','Новокаланчак':'novokalanchak','Камышовка':'kamyshovka','Новосёловка':'novoselivka','Дмитровка':'dmytrivka'};

  function showRoute(route){activeRoute=route;activeDirection=0;activeView='schedule';routeMenu.hidden=true;routeDetail.hidden=false;if(safeCityKey==='villages'){cityCoverImage.src=`../../assets/schedule-villages/${villagePhotos[route.id]}.webp?v=1`;cityCoverImage.alt=route.id;cityTitle.textContent='Расписание · '+route.id;citySubtitle.textContent=route.name}routeTitle.textContent=activeGroup.icon+' '+displayRoute(route.id);routeMeta.textContent=route.name+' · '+route.days;fare.textContent=activeGroup.fare||'';fare.hidden=!activeGroup.fare;directions.innerHTML=route.directions.map((direction,index)=>`<button class="direction" type="button" data-direction="${index}" aria-pressed="${index===0}">${escapeHtml(direction.label)}</button>`).join('');directions.querySelectorAll('[data-direction]').forEach(button=>button.addEventListener('click',()=>setDirection(Number(button.dataset.direction))));setDirection(0);setView('schedule');scrollHere()}
  function setDirection(index){activeDirection=index;directions.querySelectorAll('.direction').forEach((button,buttonIndex)=>button.setAttribute('aria-pressed',String(buttonIndex===index)));renderDirection()}
  function renderDirection(){const direction=activeRoute.directions[activeDirection];const facts=[];if(direction.hours)facts.push(`<div class="fact"><span>Часы работы</span><strong>${escapeHtml(direction.hours)}</strong></div>`);if(direction.interval)facts.push(`<div class="fact"><span>Интервал</span><strong>${escapeHtml(direction.interval)} мин</strong></div>`);if(direction.departures.length)facts.push(`<div class="fact"><span>Первый рейс</span><strong>${escapeHtml(direction.departures[0])}</strong></div><div class="fact"><span>Последний рейс</span><strong>${escapeHtml(direction.departures.at(-1))}</strong></div>`);schedulePanel.innerHTML=`<div class="summary"><p class="route-name">${escapeHtml(direction.name)}</p>${facts.length?`<div class="facts">${facts.join('')}</div>`:''}${direction.departures.length?`<div class="departures">${direction.departures.map(time=>`<span class="departure">${escapeHtml(time)}</span>`).join('')}</div>`:''}${direction.extra?`<p class="extra">${escapeHtml(direction.extra)}</p>`:''}</div>`;renderMap(direction);renderStops(direction)}
  function renderMap(direction){window.IzmailRouteMap.mount(mapView,direction,{routeLabel:displayRoute(activeRoute.id)})}
  function renderStops(direction){stopsView.innerHTML=`<ol class="stops-list">${direction.stops.map(stop=>`<li>${escapeHtml(stop.name)}</li>`).join('')}</ol>`}
  function setView(view){activeView=view;viewTabs.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===view)));schedulePanel.hidden=view!=='schedule';mapView.hidden=view!=='map';stopsView.hidden=view!=='stops';if(view==='map'){const frame=mapView.querySelector('iframe[data-src]');if(frame&&!frame.src){frame.src=frame.dataset.src}}}
  viewTabs.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>setView(button.dataset.view)));backToTypes.addEventListener('click',showTypes);sectionBacks.forEach(button=>button.addEventListener('click',()=>{if(safeCityKey==='kyiv'&&activeGroup)showTypes();else location.href='../#schedule'}));backToRoutes.addEventListener('click',()=>showRoutes(activeGroup.id));document.addEventListener('pointerdown',event=>{const control=event.target.closest('button,.back,.home-back');if(!control)return;control.classList.add('tap-lit');setTimeout(()=>control.classList.remove('tap-lit'),420)},{passive:true});
  const cityKey=new URLSearchParams(location.search).get('city')||'villages';
  const safeCityKey=/^[a-z]+$/.test(cityKey)?cityKey:'villages';
  const cityCoverFile=safeCityKey==='villages'?`${safeCityKey}.jpg?v=1`:`${safeCityKey}-v2.webp?v=2`;
  cityCoverImage.src=`../../assets/schedule-cities/${cityCoverFile}`;
  fetch(`./data/${safeCityKey}.json?v=20261001-2`,{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('data');return response.json()}).then(payload=>{data=payload;cityTitle.textContent=data.title;citySubtitle.textContent=data.subtitle;cityCoverImage.alt=data.title;menuTitle.textContent='Выберите направление';document.title=data.title+' — Справочник Измаил';buildTypes();loading.hidden=true;content.hidden=false;const query=new URLSearchParams(location.search),group=data.groups.find(item=>item.id===query.get('group')),route=group?.routes.find(item=>item.id===query.get('route'));if(group&&route){showRoutes(group.id);showRoute(route)}else if(safeCityKey==='villages'){backToTypes.hidden=true;showRoutes(data.groups[0].id)}}).catch(()=>{typeMenu.innerHTML='<p class="error">Не удалось загрузить расписание. Обновите страницу и попробуйте ещё раз.</p>'});
})();
</script>
