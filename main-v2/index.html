<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=overlays-content">
<meta name="theme-color" content="#03172f">
<title>Справочник Измаил</title>

<style>
:root {
  --stage-w:min(100vw,48.80vh,600px);
  --stage-w:min(100vw,48.80svh,600px);
  --stage-h:min(178.3vw,87.00vh,1069.8px);
  --stage-h:min(178.3vw,87.00svh,1069.8px);
  --navy:#051b37;
  --navy2:#03142b;
  --line:#2f6f9e;
  --line-strong:#3b86b4;
  --press:#2b8fc4;
  --text:#ffffff;
}
* { box-sizing:border-box; }
html, body {
  margin:0; width:100%; height:100%; min-height:100vh; min-height:100svh;
  overflow:hidden !important; overscroll-behavior:none;
  background:var(--navy2); color:var(--text);
  font-family:Arial, Helvetica, sans-serif; -webkit-text-size-adjust:100%;
}
body { position:fixed; inset:0; width:100vw; height:100vh; height:100svh; display:grid; justify-items:center; align-content:start; }
button, input { font:inherit; }
button { -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
#app {
  position:relative; left:auto; top:auto; width:var(--stage-w); height:var(--stage-h); max-width:100vw; max-height:100vh; max-height:100svh;
  overflow:hidden; background:var(--navy2); container-type:inline-size; transform:translate3d(0,0,0);
}
.bg-blur {
  position:absolute; inset:-2%; width:104%; height:104%; object-fit:cover; object-position:center top;
  filter:blur(8px) brightness(.60) saturate(.95); transform:scale(1.02); z-index:0;
}
.bg-main {
  position:absolute; left:3.7%; top:0.55%; width:92.8%; height:auto; max-height:100%;
  object-fit:contain; object-position:center top; z-index:1; pointer-events:none;
}
.fade {
  position:absolute; inset:27% 0 0; z-index:2; pointer-events:none;
  background:linear-gradient(to bottom, rgba(3,20,43,0) 0%, rgba(3,20,43,.12) 13%, rgba(3,20,43,.42) 38%, rgba(2,18,39,.76) 66%, rgba(2,16,36,.98) 91%, #021127 100%);
}
.ui { position:absolute; inset:0; z-index:5; }

.viewer {
  position:absolute; left:6.6%; top:29.05%; min-height:17px; height:auto;
  display:flex; align-items:center; gap:5px; width:max-content; max-width:92%; padding:3px 8px;
  white-space:nowrap; overflow:visible;
  border-radius:999px;
  background:rgba(1,14,30,.42);
  border:1px solid rgba(135,196,226,.32);
  box-shadow:
    0 2px 9px rgba(0,0,0,.24),
    inset 0 0 0 1px rgba(255,255,255,.05);
  -webkit-backdrop-filter:blur(3px);
  backdrop-filter:blur(3px);
  font-size:clamp(8px,1.9vw,10.6px);
  font-size:clamp(8px,1.9cqw,10.6px);
  font-weight:800;
  color:#eaf7ff;
}

.top-row {
  position:absolute; left:7.2%; top:32.15%; width:85.6%; height:4.75%;
  display:grid; grid-template-columns:1fr 1fr 1.08fr; gap:1.15%;
}
.panel, .search-display, .card, .groups, .nav, .shelter {
  border:1.6px solid var(--line);
  background:linear-gradient(145deg,rgba(6,38,76,.96),rgba(3,25,56,.99));
  box-shadow:0 0 8px rgba(47,111,158,.28), inset 0 0 12px rgba(47,111,158,.07), 0 4px 12px rgba(0,0,0,.20);
}
.panel { min-width:0; border-radius:12px; overflow:hidden; }
.info { padding:6px 9px; display:flex; flex-direction:column; justify-content:center; }
.info-title { font-size:clamp(8px,2vw,11px);
  font-size:clamp(8px,2cqw,11px); font-weight:900; text-transform:uppercase; text-decoration:underline; text-underline-offset:2px; }
.temp { font-size:clamp(16px,4.2vw,23px);
  font-size:clamp(16px,4.2cqw,23px); line-height:1; font-weight:900; margin-top:4px; }
.condition { font-size:clamp(7.5px,1.8vw,9.8px);
  font-size:clamp(7.5px,1.8cqw,9.8px); margin-top:3px; opacity:.88; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rate { display:flex; justify-content:space-between; gap:4px; margin-top:5px; font-size:clamp(8px,2vw,11px);
  font-size:clamp(8px,2cqw,11px); font-weight:900; }

.shelter {
  position:relative; overflow:visible; border-radius:12px; color:#fff;
  background:linear-gradient(145deg,rgba(145,8,36,.95),rgba(71,3,24,.98));
  box-shadow:0 0 8px rgba(47,111,158,.28), inset 0 0 12px rgba(255,80,103,.10), 0 4px 12px rgba(0,0,0,.20);
  display:flex; align-items:center; padding:0 4.5%; gap:4%; cursor:pointer;
}
.shield { width:25%; aspect-ratio:.9; display:grid; place-items:center; clip-path:polygon(50% 0,92% 15%,86% 65%,50% 100%,14% 65%,8% 15%); background:linear-gradient(145deg,#f4f8ff,#d9e8ff); color:#dc1f3d; font-size:clamp(14px,3.8vw,21px);
  font-size:clamp(14px,3.8cqw,21px); font-weight:900; }
.shelter-label { flex:1; text-align:center; font-size:clamp(13px,3.6vw,18px);
  font-size:clamp(13px,3.6cqw,18px); line-height:1.05; font-weight:900; }
.chev { margin-left:auto; font-size:clamp(20px,5.3vw,30px);
  font-size:clamp(20px,5.3cqw,30px); font-weight:300; }

.search-wrap {
  position:absolute; left:4.2%; top:37.50%; width:91.6%; height:5.15%;
}

.search-icon {
  position:absolute; right:3.2%; left:auto; top:50%; transform:translateY(-50%); z-index:3;
  width:8%; height:72%; display:grid; place-items:center; padding:0;
  border:0; border-radius:10px; background:transparent; color:#d9f7ff;
  font:clamp(26px,6.7vw,38px)/1 Arial,sans-serif;
  font:clamp(26px,6.7cqw,38px)/1 Arial,sans-serif; cursor:pointer;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.search-icon:focus-visible{outline:2px solid #83caff;outline-offset:0}
.search-clear{position:absolute;left:3.2%;top:50%;transform:translateY(-50%);z-index:3;width:8%;height:72%;display:grid;place-items:center;padding:0;border:0;border-radius:10px;background:transparent;color:#d9f7ff;font:26px/1 Arial,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.search-clear:focus-visible{outline:2px solid #83caff;outline-offset:0}
.search-real::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}


.search-real {
  position:absolute; inset:0; width:100%; height:100%;
  border:1.7px solid var(--line); border-radius:17px; outline:none;
  padding:0 12% 0 12%; color:#fff;
  background:linear-gradient(145deg,rgba(6,38,76,.98),rgba(3,25,56,.995));
  box-shadow:0 0 8px rgba(47,111,158,.28), inset 0 0 12px rgba(47,111,158,.07);
  font-size:16px; font-weight:800;
  caret-color:#9ddfff; -webkit-appearance:none; appearance:none;
}

.search-real::placeholder {
  color:rgba(255,255,255,.84); opacity:1;
}

.search-real:focus {
  border-color:var(--line-strong);
  box-shadow:0 0 10px rgba(58,134,180,.34), inset 0 0 13px rgba(47,111,158,.10);
}

.cards {
  position:absolute; left:4.2%; top:43.25%; width:91.6%; height:36.95%;
  display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(4,1fr); gap:1.05% 2.1%;
}
.card { position:relative; overflow:visible; border-radius:15px; padding:0; color:#fff; cursor:pointer; transition:transform .08s ease, filter .08s ease; }
.card-photo {
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:12px; z-index:0; filter:brightness(1.22) saturate(1.03);
}
.card-overlay {
  position:absolute; inset:0; z-index:1; border-radius:12px;
  background:linear-gradient(to right, rgba(0,15,37,.82) 0%, rgba(0,17,41,.48) 56%, rgba(0,16,39,.06) 100%), linear-gradient(to top, rgba(0,8,24,.62), rgba(0,8,24,.01) 70%);
}
.card-copy { position:absolute; left:5%; right:14%; bottom:10%; z-index:2; text-align:left; }
.card-copy strong { display:block; font-size:clamp(13px,3.7vw,20px);
  font-size:clamp(13px,3.7cqw,20px); font-weight:900; line-height:1.03; white-space:nowrap; color:#fff; text-shadow:0 2px 4px rgba(0,0,0,.70); }
.card-copy small { display:block; margin-top:5px; font-size:clamp(9px,2.18vw,11.7px);
  font-size:clamp(9px,2.18cqw,11.7px); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:rgba(255,255,255,.94); text-shadow:0 1px 3px rgba(0,0,0,.72); }
.card.compact .card-copy { left:4.2%; right:10%; }
.card.compact .card-copy strong { font-size:clamp(11.5px,3.1vw,16.5px);
  font-size:clamp(11.5px,3.1cqw,16.5px); white-space:nowrap; letter-spacing:-.03em; }
.card-arrow { position:absolute; right:4%; top:50%; transform:translateY(-50%); z-index:2; font-size:clamp(24px,6.3vw,34px);
  font-size:clamp(24px,6.3cqw,34px); font-weight:300; color:#e3fbff; }
.card.filtered { opacity:.20; filter:grayscale(.9); }

.groups {
  position:absolute; left:4.2%; top:81.15%; width:44.3%; height:5.6%;
  overflow:visible; border-radius:16px; color:#fff; display:flex; align-items:center; padding:0 4%; cursor:pointer;
}
.groups.zags-shortcut { left:auto; right:4.2%; }
.groups.zags-shortcut .groups-title { position:absolute; left:50%; margin:0; transform:translateX(-50%); }
.groups:not(.zags-shortcut) .groups-title { position:absolute; left:50%; margin:0; transform:translateX(-50%); }
.people { font-size:clamp(23px,6vw,35px);
  font-size:clamp(23px,6cqw,35px); width:15%; }
.groups-title { font-size:clamp(13px,3.65vw,19px);
  font-size:clamp(13px,3.65cqw,19px); font-weight:900; margin-left:2%; white-space:nowrap; }
.telegram { margin-left:auto; width:8%; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; background:#20a8ea; box-shadow:0 0 9px rgba(32,168,234,.45); font-size:clamp(14px,4vw,20px);
  font-size:clamp(14px,4cqw,20px); }
.groups-chev { font-size:clamp(22px,5.6vw,31px);
  font-size:clamp(22px,5.6cqw,31px); margin-left:2%; }

.bottom {
  position:absolute; left:4.2%; top:88.05%; width:91.6%; height:5.35%;
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:2%;
}
.nav { position:relative; overflow:visible; border-radius:15px; color:#fff; display:flex; align-items:center; justify-content:center; gap:5%; cursor:pointer; font-size:clamp(12px,3.2vw,17px);
  font-size:clamp(12px,3.2cqw,17px); font-weight:900; }
.nav.active { border-color:var(--line-strong); box-shadow:0 0 10px rgba(58,143,198,.28), inset 0 0 13px rgba(47,111,158,.08), 0 4px 12px rgba(0,0,0,.20); }
.nav-icon { font-size:clamp(20px,5.3vw,29px);
  font-size:clamp(20px,5.3cqw,29px); }

.agreement {
  position:absolute; left:16%; right:16%; top:95.25%; height:2.4%; display:grid; place-items:center;
  color:rgba(255,255,255,.76); font-size:clamp(10px,2.35vw,12.8px);
  font-size:clamp(10px,2.35cqw,12.8px); text-decoration:underline; text-underline-offset:3px; cursor:pointer;
}

.press-glow {
  position:absolute; inset:-3px; z-index:50; pointer-events:none; border-radius:inherit; border:3px solid transparent; opacity:0;
}
.pressable:active { transform:scale(.968); filter:brightness(1.12); }
.pressable:active .press-glow {
  opacity:1; border-color:#3f94c5;
  box-shadow:0 0 6px 2px rgba(63,148,197,.90), 0 0 14px 5px rgba(43,143,196,.62), 0 0 24px 8px rgba(31,102,154,.34), inset 0 0 15px 3px rgba(43,143,196,.20);
}
.pressable.flash { transform:scale(.968); filter:brightness(1.13); }
.pressable.flash .press-glow { opacity:1; animation:strictBlueFlash .68s ease-out both; }
@keyframes strictBlueFlash {
  0% { border-color:#3f94c5; box-shadow:0 0 7px 2px rgba(63,148,197,.94), 0 0 16px 6px rgba(43,143,196,.68), 0 0 26px 9px rgba(31,102,154,.38), inset 0 0 17px 3px rgba(43,143,196,.22); }
  55% { border-color:#397fad; box-shadow:0 0 5px 2px rgba(63,148,197,.72), 0 0 12px 4px rgba(43,143,196,.50), 0 0 20px 7px rgba(31,102,154,.28), inset 0 0 13px 3px rgba(43,143,196,.16); }
  100% { opacity:0; border-color:transparent; box-shadow:none; }
}

.toast {
  position:absolute; left:50%; bottom:8%; z-index:99; transform:translate(-50%,12px); max-width:82%; padding:9px 12px;
  border-radius:12px; background:rgba(3,20,47,.96); border:1px solid var(--line); font-size:clamp(11px,2.7vw,14px);
  font-size:clamp(11px,2.7cqw,14px); font-weight:800;
  text-align:center; opacity:0; pointer-events:none; transition:.2s ease;
}
.toast.show { opacity:1; transform:translate(-50%,0); }

/* Нижняя навигация — отдельный красивый фон, а не пустые тёмные кнопки. */
.nav {
  overflow:hidden;
  background:
    radial-gradient(circle at 22% 20%, rgba(66,135,190,.30), transparent 38%),
    radial-gradient(circle at 82% 82%, rgba(20,76,126,.38), transparent 42%),
    linear-gradient(145deg, #0a3158 0%, #061f3d 52%, #04172e 100%) !important;
  box-shadow:
    0 0 8px rgba(47,111,158,.30),
    inset 0 1px 0 rgba(255,255,255,.05),
    inset 0 0 18px rgba(47,111,158,.08),
    0 4px 12px rgba(0,0,0,.22) !important;
}

.nav::before {
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.48;
  background:
    linear-gradient(125deg, transparent 0 44%, rgba(104,174,224,.08) 45% 47%, transparent 48% 100%),
    linear-gradient(180deg, rgba(255,255,255,.025), transparent 45%);
}

.nav > * {
  position:relative;
  z-index:2;
}

.nav.active {
  background:
    radial-gradient(circle at 25% 18%, rgba(72,150,206,.38), transparent 40%),
    radial-gradient(circle at 78% 84%, rgba(24,94,151,.42), transparent 44%),
    linear-gradient(145deg, #0c3b68 0%, #082847 52%, #051a33 100%) !important;
}


/* ----- Final screen-fit fixes ----- */

/* Bottom navigation glow must remain visible outside the button edge. */
.nav {
  overflow:visible !important;
}
.nav .press-glow {
  inset:-3px !important;
  z-index:80 !important;
  border-radius:17px !important;
}
.nav:active .press-glow,
.nav.flash .press-glow {
  opacity:1 !important;
  border-color:#3f94c5 !important;
}

/* Compact currency typography so both rates always fit. */
.currency-panel .info-title {
  font-size:clamp(7.5px,1.85vw,10px) !important;
  font-size:clamp(7.5px,1.85cqw,10px) !important;
}
.currency-panel .rate {
  margin-top:3px !important;
  font-size:clamp(7.5px,1.9vw,10.5px) !important;
  font-size:clamp(7.5px,1.9cqw,10.5px) !important;
  line-height:1.05 !important;
}

/* Weather gets its own visual surface instead of a dark empty-looking block. */
.weather-panel {
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 82% 24%, rgba(105,183,232,.28), transparent 34%),
    linear-gradient(145deg, rgba(14,65,107,.97), rgba(4,31,62,.99)) !important;
}
.weather-panel::after {
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.035), transparent 45%);
}
.weather-mini {
  position:absolute;
  right:6px;
  top:50%;
  transform:translateY(-50%);
  z-index:4;
  width:25px;
  height:25px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:16px;
  background:rgba(8,42,72,.58);
  border:1px solid rgba(93,159,202,.38);
  box-shadow:0 0 7px rgba(47,111,158,.20);
}
.weather-panel .info-title,
.weather-panel .temp,
.weather-panel .condition {
  position:relative;
  z-index:5;
  max-width:72%;
}


.viewer-eye{
  font-size:clamp(10px,2.3vw,13px);
  font-size:clamp(10px,2.3cqw,13px);
  line-height:1;
  opacity:.98;
}
.viewer-label{
  white-space:nowrap;
  letter-spacing:.01em;
  flex:0 0 auto;
}
.viewer #viewCount{flex:0 0 auto;font-variant-numeric:tabular-nums;}


/* --- Надёжные клики и свечение круглой аватарки --- */
#mainLogoHotspot.logo-click{
  position:absolute;
  left:10.7%;
  top:8.35%;
  width:28.7%;
  aspect-ratio:1/1;
  z-index:95;
  display:block;
  border-radius:50%;
  background:transparent !important;
  border:0 !important;
  box-shadow:none !important;
  outline:0 !important;
  opacity:1;
  text-decoration:none;
  pointer-events:auto;
  -webkit-tap-highlight-color:transparent;
}
a.shelter,
a.nav{ text-decoration:none; }
#shelterBtn{ z-index:30; pointer-events:auto; }
#adsBtn{ pointer-events:auto; }
#agreement{
  z-index:95;
  pointer-events:auto;
  text-decoration:underline;
  text-underline-offset:3px;
  -webkit-tap-highlight-color:transparent;
}


#mainLogoHotspot,
#mainLogoHotspot:active,
#mainLogoHotspot:focus,
#mainLogoHotspot:focus-visible{
  background:transparent !important;
  border:0 !important;
  box-shadow:none !important;
  outline:0 !important;
  filter:none !important;
  transform:none !important;
}


/* =========================================================
   ПОГОДА / КУРС — КОМПАКТНАЯ ЖИВАЯ ИНФОРМАЦИЯ
   ========================================================= */

.weather-panel{
  padding:4px 7px !important;
  justify-content:center !important;
  align-items:stretch !important;
}

.weather-panel .info-title{
  font-size:clamp(6.8px,1.55vw,8.8px) !important;
  font-size:clamp(6.8px,1.55cqw,8.8px) !important;
  line-height:1 !important;
  text-decoration:none !important;
  opacity:.82;
  letter-spacing:.025em;
  width:calc(100% - 29px);
  max-width:calc(100% - 29px);
  margin-left:auto;
  margin-right:auto;
  text-align:center;
}

.weather-panel .temp{
  margin-top:2px !important;
  font-size:clamp(13px,3.35vw,18px) !important;
  font-size:clamp(13px,3.35cqw,18px) !important;
  line-height:.95 !important;
  width:calc(100% - 29px);
  max-width:calc(100% - 29px);
  margin-left:auto;
  margin-right:auto;
  text-align:center;
}

.weather-panel .condition{
  margin-top:2px !important;
  width:calc(100% - 29px);

  font-size:clamp(6.7px,1.55vw,8.8px) !important;

  opacity:.96 !important;

}

.weather-extra{
  position:relative;
  z-index:5;
  width:calc(100% - 29px);
  max-width:calc(100% - 29px);

  margin-left:auto;
  margin-right:auto;
  color:rgba(220,240,255,.76);
  font-size:clamp(5.7px,1.28vw,7.4px);
  font-size:clamp(5.7px,1.28cqw,7.4px);
  font-weight:700;
  line-height:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:center;
}

.weather-mini{
  right:5px !important;
  width:24px !important;
  height:24px !important;
  font-size:15px !important;
  background:rgba(8,42,72,.48) !important;
  border-color:rgba(93,159,202,.28) !important;
}

.currency-panel{
  position:relative;
  overflow:hidden;
  padding:4px 8px !important;
  justify-content:center !important;
  background:
    radial-gradient(circle at 84% 28%, rgba(71,147,202,.18), transparent 35%),
    linear-gradient(145deg,rgba(7,43,81,.97),rgba(3,26,56,.99)) !important;
}

.currency-panel .info-title{
  position:relative;
  z-index:3;
  font-size:clamp(6.8px,1.55vw,8.8px) !important;
  font-size:clamp(6.8px,1.55cqw,8.8px) !important;
  line-height:1 !important;
  text-decoration:none !important;
  opacity:.82;
  letter-spacing:.025em;
}

.currency-panel .rate{
  position:relative;
  z-index:3;
  margin-top:3px !important;
  gap:5px !important;
  font-size:clamp(7px,1.65vw,9.2px) !important;
  font-size:clamp(7px,1.65cqw,9.2px) !important;
  line-height:1 !important;
  font-weight:800 !important;
}

.currency-panel .rate span:first-child{
  opacity:.82;
  font-size:.92em;
}

.currency-panel .rate span:last-child{
  font-variant-numeric:tabular-nums;
}

.currency-watermark{
  position:absolute;
  right:5px;
  bottom:-8px;
  z-index:1;
  color:rgba(115,191,235,.075);
  font-size:42px;

<script>

(function(){
  "use strict";

  var CFG = window.IZMAIL_SETTINGS || {};

  var DEFAULT_SEASON_IMAGES = {"spring":"../assets/izmail-home.jpg","summer":"../assets/izmail-home.jpg","autumn":"../assets/izmail-home-autumn.png","winter":"../assets/izmail-home-winter.png"};
  var NIGHT_SEASON_IMAGES = {"spring":"../assets/izmail-home-summer-night.png","summer":"../assets/izmail-home-summer-night.png","autumn":"../assets/izmail-home-autumn-night.png","winter":"../assets/izmail-home-winter-night.png"};
  var DAY_SEASON_IMAGES = {"spring":"../assets/izmail-home-summer-day.png","summer":"../assets/izmail-home-summer-day.png","autumn":"../assets/izmail-home-autumn-day.png","winter":"../assets/izmail-home-winter-day.png"};
  var SEASON_IMAGES = Object.assign({}, DEFAULT_SEASON_IMAGES, CFG.seasonImages || {});

  var app = document.getElementById("app");
  var bgMain = document.getElementById("bgMain");
  var bgBlur = document.getElementById("bgBlur");
  var sceneLayer = document.getElementById("sceneLayer");
  var sceneBadge = document.getElementById("sceneBadge");
  var canvas = document.getElementById("weatherCanvas");
  var ctx = canvas ? canvas.getContext("2d") : null;

  var seasonBtn = null;
  var timeBtn = null;
  var weatherBtn = null;
  var autoBtn = null;

  var seasons = ["spring","summer","autumn","winter"];
  var times = ["morning","day","evening","night"];
  var weathers = ["clear","cloudy","rain","snow"];

  var labels = {
    spring:"ВЕСНА", summer:"ЛЕТО", autumn:"ОСЕНЬ", winter:"ЗИМА",
    morning:"УТРО", day:"ДЕНЬ", evening:"ВЕЧЕР", night:"НОЧЬ",
    clear:"ЯСНО", cloudy:"ОБЛАЧНО", rain:"ДОЖДЬ", snow:"СНЕГ"
  };

  var state = {
    season:(CFG.initial && CFG.initial.season) || "summer",
    time:(CFG.initial && CFG.initial.time) || "morning",
    weather:(CFG.initial && CFG.initial.weather) || "clear"
  };

  state.intensity=0;
  state.wind=0;
  state.thunder=false;state.hail=false;state.fog=false;
  var leaves=[],hailstones=[];
  var lightningAt=0;
  var reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)");
  var particles = [];
  var fxMode = "clear";
  var lastFrame = performance.now();
  var autoTimer = null;
  var autoIndex = 0;

  var autoScenes = [];

  function indexOfValue(list, value){
    for(var i=0;i<list.length;i++) if(list[i]===value) return i;
    return 0;
  }

  function nextValue(list,value){
    var i=indexOfValue(list,value);
    return list[(i+1)%list.length];
  }

  function setAutoActive(active){
    if(!autoBtn) return;
    if(active) autoBtn.classList.add("active");
    else autoBtn.classList.remove("active");
  }

  function resizeCanvas(){
    if(!canvas || !ctx || !sceneLayer) return;
    var r=sceneLayer.getBoundingClientRect();
    var dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.max(1,Math.round(r.width*dpr));
    canvas.height=Math.max(1,Math.round(r.height*dpr));
    canvas.style.width=r.width+"px";
    canvas.style.height=r.height+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function seedParticles(mode){
    particles=[];
    if(!sceneLayer) return;
    var r=sceneLayer.getBoundingClientRect();

    if(mode==="rain"){
      var rc=(CFG.effects && CFG.effects.rain) || {};
      var rainCount=Math.round(Number(rc.count || 118)*state.intensity);
      var frontEvery=Number(rc.frontEvery || 5);
      for(var i=0;i<rainCount;i++){
        var front = (i % frontEvery === 0);
        particles.push({
          x:Math.random()*r.width,
          y:Math.random()*r.height,
          len:(front ? Number(rc.frontMinLength || 8) : Number(rc.backMinLength || 5))
              + Math.random()*(front ? Number(rc.frontLengthRange || 7) : Number(rc.backLengthRange || 5)),
          speed:(front ? Number(rc.frontMinSpeed || 190) : Number(rc.backMinSpeed || 155))
                + Math.random()*(front ? Number(rc.frontSpeedRange || 150) : Number(rc.backSpeedRange || 120)),
          drift:-Number(rc.driftMin || 24)-Math.random()*Number(rc.driftRange || 20),
          alpha:(front ? Number(rc.frontAlpha || .26) : Number(rc.backAlpha || .18))
                + Math.random()*(front ? Number(rc.frontAlphaRange || .20) : Number(rc.backAlphaRange || .16)),
          width:(front ? Number(rc.frontWidth || .82) : Number(rc.backWidth || .56))
                + Math.random()*(front ? Number(rc.frontWidthRange || .48) : Number(rc.backWidthRange || .32))
        });
      }
    }

    if(mode==="snow"){
      var sc=(CFG.effects && CFG.effects.snow) || {};
      var snowCount=Math.min(210,Math.round(Number(sc.count || 78)*1.5*state.intensity));
      for(var j=0;j<snowCount;j++){
        particles.push({
          x:Math.random()*r.width,
          y:Math.random()*r.height,
          radius:.7+Math.random()*1.65,
          speed:32+Math.random()*44,
          drift:-Number(sc.driftMin || 5)+Math.random()*Number(sc.driftRange || 10),
          phase:Math.random()*Math.PI*2,
          alpha:Number(sc.alpha || .34)+Math.random()*Number(sc.alphaRange || .34)
        });
      }
    }
  }

  function seedWind(){
    if(state.wind<5 || state.weather==='rain' || state.weather==='snow') return;
    var r=sceneLayer.getBoundingClientRect();
    for(var i=0;i<14;i++) particles.push({x:Math.random()*r.width,y:Math.random()*r.height,len:12+Math.random()*20,speed:35+state.wind*7,alpha:.04+Math.random()*.08});
  }

  function seedSeasonDetails(){
    leaves=[];hailstones=[];
    var r=sceneLayer.getBoundingClientRect();
    if(state.season==='autumn' && state.weather!=='snow' && !state.hail){
      for(var i=0;i<5;i++)leaves.push({x:Math.random()*r.width,y:i===0?r.height*.18:-Math.random()*r.height*2,size:1.8+Math.random()*2.4,angle:Math.random()*6.28,speed:12+Math.random()*14,phase:Math.random()*6.28});
    }
    if(state.hail){
      for(var j=0;j<42;j++)hailstones.push({x:Math.random()*r.width,y:Math.random()*r.height,size:1+Math.random()*1.3,speed:220+Math.random()*120});
    }
    lightningAt=performance.now()+4500;
  }
  function drawSeasonDetails(now,dt,r){
    for(var i=0;i<leaves.length;i++){
      var leaf=leaves[i];leaf.y+=leaf.speed*dt;leaf.phase+=dt;leaf.angle+=dt*.9;
      leaf.x+=(Math.sin(leaf.phase)*9-state.wind*1.7)*dt;
      if(leaf.y>r.height+12||leaf.x<-15){leaf.y=-20-Math.random()*r.height;leaf.x=Math.random()*r.width;}
      if(leaf.y<0)continue;
      ctx.save();ctx.translate(leaf.x,leaf.y);ctx.rotate(leaf.angle);ctx.scale(Math.cos(leaf.phase)*.35+.65,1);
      ctx.beginPath();ctx.ellipse(0,0,leaf.size*.48,leaf.size,0,0,Math.PI*2);ctx.fillStyle='rgba(187,119,48,'+(.7*fadeByY(leaf.y,r.height))+')';ctx.fill();ctx.restore();
    }
    for(var j=0;j<hailstones.length;j++){
      var ice=hailstones[j];ice.y+=ice.speed*dt;ice.x-=state.wind*4*dt;
      if(ice.y>r.height+8||ice.x<-8){ice.y=-10-Math.random()*60;ice.x=Math.random()*r.width;}
      ctx.beginPath();ctx.arc(ice.x,ice.y,ice.size,0,Math.PI*2);ctx.fillStyle='rgba(224,241,255,'+(.76*fadeByY(ice.y,r.height))+')';ctx.fill();
    }
    // A slow single flash is symbolic; never mimic a fast strobe.
    if(state.thunder){
      var flashAge=now-lightningAt;
      if(flashAge>=0 && flashAge<500){
        var alpha=Math.sin(flashAge/500*Math.PI);
        ctx.fillStyle='rgba(195,216,249,'+(alpha*.09)+')';ctx.fillRect(0,0,r.width,r.height*.72);
        ctx.beginPath();ctx.moveTo(r.width*.91,r.height*.53);ctx.lineTo(r.width*.86,r.height*.59);ctx.lineTo(r.width*.90,r.height*.58);ctx.lineTo(r.width*.82,r.height*.69);
        ctx.strokeStyle='rgba(222,235,255,'+(alpha*.42)+')';ctx.lineWidth=1.1;ctx.stroke();
      }else if(flashAge>=500){lightningAt=now+11000+Math.random()*7000;}
    }
  }

  function fadeByY(y,height){
    var p=y/Math.max(height,1);
    var fx=(CFG.effects || {});
    var start=Number(fx.fadeStart == null ? .72 : fx.fadeStart);
    var end=Number(fx.fadeEnd == null ? 1 : fx.fadeEnd);
    if(p<=start) return 1;
    if(p>=end) return 0;
    return Math.max(0,1-(p-start)/Math.max(.01,end-start));
  }

  function drawWeather(now){
    if(!ctx || !sceneLayer){
      requestAnimationFrame(drawWeather);
      return;
    }

    if(document.hidden){lastFrame=now;requestAnimationFrame(drawWeather);return;}
    if(reducedMotion.matches){ctx.clearRect(0,0,canvas.width,canvas.height);lastFrame=now;requestAnimationFrame(drawWeather);return;}
    var r=sceneLayer.getBoundingClientRect();
    var dt=Math.min((now-lastFrame)/1000,.05);
    lastFrame=now;
    ctx.clearRect(0,0,r.width,r.height);

    if(fxMode==="rain"){
      ctx.lineCap="round";

      for(var i=0;i<particles.length;i++){
        var p=particles[i];
        p.y+=p.speed*(.8+state.intensity*.35)*dt;
        p.x+=(p.drift-state.wind*6)*dt;

        if(p.y>r.height+16 || p.x<-20){
          p.y=-10-Math.random()*45;
          p.x=Math.random()*r.width+20;
        }

        var f=fadeByY(p.y,r.height);
        if(f<=0) continue;

        ctx.beginPath();
        ctx.moveTo(p.x,p.y);
        ctx.lineTo(p.x+2.4+state.wind*.8,p.y-p.len*(.8+state.intensity*.3));
        ctx.strokeStyle="rgba(226,244,255,"+(p.alpha*f)+")";
        ctx.lineWidth=p.width;
        ctx.stroke();
      }
    }

    if(fxMode==="snow"){
      for(var j=0;j<particles.length;j++){
        var s=particles[j];
        s.phase+=dt*1.4;
        s.y+=s.speed*(.9+state.intensity*.25)*dt;
        s.x+=(s.drift-state.wind*3+Math.sin(s.phase)*3.2)*dt;

        if(s.y>r.height+7){
          s.y=-7-Math.random()*30;
          s.x=Math.random()*r.width;
        }
        if(s.x<-5) s.x=r.width+5;
        if(s.x>r.width+5) s.x=-5;

        var sf=fadeByY(s.y,r.height);
        if(sf<=0) continue;

        ctx.beginPath();
        ctx.arc(s.x,s.y,s.radius,0,Math.PI*2);
        ctx.fillStyle="rgba(255,255,255,"+(s.alpha*sf)+")";
        ctx.fill();
      }
    }

    if(state.wind>=5 && fxMode!=='rain' && fxMode!=='snow'){
      for(var k=0;k<particles.length;k++){
        var w=particles[k];w.x-=w.speed*dt;
        if(w.x < -w.len){w.x=r.width+w.len;w.y=Math.random()*r.height;}
        ctx.beginPath();ctx.moveTo(w.x,w.y);ctx.quadraticCurveTo(w.x+w.len*.5,w.y-2,w.x+w.len,w.y);
        ctx.strokeStyle='rgba(221,239,246,'+(w.alpha*fadeByY(w.y,r.height))+')';ctx.lineWidth=.7;ctx.stroke();
      }
    }
    drawSeasonDetails(now,dt,r);
    requestAnimationFrame(drawWeather);
  }

  function updateButtons(){
    if(seasonBtn) seasonBtn.textContent="СЕЗОН · "+labels[state.season];
    if(timeBtn) timeBtn.textContent="ВРЕМЯ · "+labels[state.time];
    if(weatherBtn) weatherBtn.textContent="ПОГОДА · "+labels[state.weather];
  }

  // Keep stars inside sky regions, away from the title and circular logo.
  var starsLayer=document.getElementById('starsLayer');
  if(starsLayer){
    var starSeed=217;
    function starRandom(){starSeed=(starSeed*16807)%2147483647;return (starSeed-1)/2147483646;}
    for(var starIndex=0;starIndex<54;starIndex++){
      var star=document.createElement('i');
      var upper=starIndex<34;
      var size=.55+Math.pow(starRandom(),2)*1.55;
      star.className='sky-star';
      star.style.left=(upper?43+starRandom()*54:57+starRandom()*41)+'%';
      star.style.top=(upper?1+starRandom()*8:53+starRandom()*9)+'%';
      star.style.width=star.style.height=size+'px';
      star.style.setProperty('--star-alpha',String(.4+starRandom()*.55));
      star.style.setProperty('--twinkle-duration',(3+starRandom()*6)+'s');
      star.style.animationDelay=(-starRandom()*10)+'s';
      star.style.background=starIndex%7===0?'#ffecd7':starIndex%5===0?'#d2e6ff':'#f1f5ff';
      starsLayer.appendChild(star);
    }
  }
  var pendingBackground='';
  var backgroundRequest=0;
  function updateBackground(url){
    if(pendingBackground===url) return;
    pendingBackground=url;
    var request=++backgroundRequest;
    var image=new Image();
    image.onload=function(){
      if(request!==backgroundRequest)return;
      if(bgMain && bgMain.getAttribute('src')!==url)bgMain.src=url;
      if(bgBlur && bgBlur.getAttribute('src')!==url)bgBlur.src=url;
    };
    image.onerror=function(){if(request===backgroundRequest)pendingBackground='';};
    image.src=url;
  }
  var appliedScene="";
  function applyScene(source){
    var landscape=state.weather==='snow'?'winter':state.season;
    var lightsOn=state.time==='evening'||state.time==='night';
    updateBackground((state.time==="night"?NIGHT_SEASON_IMAGES:lightsOn?SEASON_IMAGES:DAY_SEASON_IMAGES)[landscape]);

    var sceneKey=[state.season,state.time,state.weather,state.intensity,Math.round(state.wind),state.thunder,state.hail,state.fog].join(":");
    if(sceneKey===appliedScene) return;
    appliedScene=sceneKey;
    fxMode=state.weather;

    if(app)app.dataset.lamps=lightsOn?'on':'off';

    if(app){
      app.classList.remove("time-morning","time-day","time-evening","time-night");
      app.classList.add("time-"+state.time);
    }

    if(sceneLayer){
      sceneLayer.className="scene-layer "+state.time+" "+state.weather+(state.wind>=5?" windy":"")+(state.weather==="rain"&&state.intensity>=1.4?" heavy-rain":"")+(state.thunder?" thunder":"")+(state.hail?" hail":"")+(state.fog?" fog":"");
      sceneLayer.dataset.intensity=String(state.intensity);
    }

    if(sceneBadge){
      sceneBadge.textContent=(source==="auto" ? "АВТО · " : "ДЕМО · ")
        +labels[state.season]+" · "+labels[state.time]+" · "+labels[state.weather];
    }

    updateButtons();
    resizeCanvas();
    seedParticles(state.weather);
    seedWind();
    seedSeasonDetails();
  }


  function kyivHour(){
    try{
      var parts=new Intl.DateTimeFormat("en-GB",{
        timeZone:((CFG.weather && CFG.weather.timezone) || "Europe/Kyiv"),
        hour:"2-digit",
        hour12:false
      }).formatToParts(new Date());
      for(var i=0;i<parts.length;i++){
        if(parts[i].type==="hour") return parseInt(parts[i].value,10);
      }
    }catch(e){}
    return new Date().getHours();
  }

  function kyivMonth(){
    try{
      var parts=new Intl.DateTimeFormat("en-GB",{
        timeZone:((CFG.weather && CFG.weather.timezone) || "Europe/Kyiv"),
        month:"2-digit"
      }).formatToParts(new Date());
      for(var i=0;i<parts.length;i++){
        if(parts[i].type==="month") return parseInt(parts[i].value,10);
      }
    }catch(e){}
    return new Date().getMonth()+1;
  }

  function realSeason(){
    var m=kyivMonth();
    var sm=(CFG.seasons || {});
    var winter=sm.winter || [12,1,2];
    var spring=sm.spring || [3,4,5];
    var summer=sm.summer || [6,7,8];
    if(winter.indexOf(m)!==-1) return "winter";
    if(spring.indexOf(m)!==-1) return "spring";
    if(summer.indexOf(m)!==-1) return "summer";
    return "autumn";
  }

  var weatherSolar=null;
  function realTimeOfDay(){
    var solarTime=window.izmailWeatherSource.timeOfDay(weatherSolar);
    if(solarTime)return solarTime;
    var h=kyivHour();
    var tc=(CFG.time || {});
    var morning=Number(tc.morningStart == null ? 6 : tc.morningStart);
    var day=Number(tc.dayStart == null ? 11 : tc.dayStart);
    var evening=Number(tc.eveningStart == null ? 17 : tc.eveningStart);
    var night=Number(tc.nightStart == null ? 21 : tc.nightStart);
    if(h>=morning && h<day) return "morning";
    if(h>=day && h<evening) return "day";
    if(h>=evening && h<night) return "evening";
    return "night";
  }

  function weatherFromCode(code){
    if([71,73,75,77,85,86].indexOf(code)!==-1) return "snow";
    if([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].indexOf(code)!==-1) return "rain";
    if([1,2,3,45,48].indexOf(code)!==-1) return "cloudy";
    return "clear";
  }

  function syncRealScene(){
    state.season=realSeason();
    state.time=realTimeOfDay();
    applyScene("live");
  }

  resizeCanvas();
  requestAnimationFrame(drawWeather);
  syncRealScene();

  setInterval(function(){
    var oldTime=state.time;
    var oldSeason=state.season;
    state.time=realTimeOfDay();
    state.season=realSeason();
    if(oldTime!==state.time || oldSeason!==state.season) applyScene("live");
  },Number((CFG.updates && CFG.updates.clockCheckMs) || 60000));

  // The weather panel and animation share one response below.

  /* Shared view counter; loaded independently of other page features. */
  var viewCounterScript = document.createElement("script");
  viewCounterScript.src = "../view-counter.js?v=4";
  document.head.appendChild(viewCounterScript);

  /* Search results are handled by directory-search.js. */
  var cards=document.querySelectorAll(".card");

  /* LIVE WEATHER PANEL */
  var weatherPending=false;
  function loadWeather(){
    if(weatherPending) return;
    weatherPending=true;
    window.izmailWeatherSource.load()
      .then(function(d){
        var c=d.current;
        weatherSolar=d.daily||null;
        var panel=document.getElementById("weatherPanel");
        if(panel){panel.dataset.source=d.provider;panel.dataset.weatherTime=String(c.time);panel.title="Измаил · "+d.provider+" · расчёт на "+new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Kyiv',hour:'2-digit',minute:'2-digit'}).format(new Date(c.time*1000));}

        var names={
          0:"Ясно",1:"Преимущественно ясно",2:"Переменная облачность",3:"Облачно",
          45:"Туман",48:"Туман",51:"Морось",53:"Морось",55:"Сильная морось",
          61:"Небольшой дождь",63:"Дождь",65:"Сильный дождь",
          56:"Ледяная морось",57:"Сильная ледяная морось",66:"Ледяной дождь",67:"Сильный ледяной дождь",77:"Снежные зёрна",85:"Снегопад",86:"Сильный снегопад",97:"Сильная гроза",
          71:"Небольшой снег",73:"Снег",75:"Сильный снег",
          80:"Ливень",81:"Ливень",82:"Сильный ливень",95:"Гроза",96:"Гроза с градом",99:"Гроза с сильным градом"
        };
        var icons={
          0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",
          51:"🌦️",53:"🌦️",55:"🌧️",61:"🌧️",63:"🌧️",65:"🌧️",
          71:"🌨️",73:"❄️",75:"❄️",80:"🌦️",81:"🌧️",82:"🌧️",
          95:"⛈️",96:"⛈️",99:"⛈️"
        };
        var temp=document.getElementById("weatherTemp");
        var txt=document.getElementById("weatherText");
        var icon=document.getElementById("weatherIcon");
        if(c.weather_code == null || !isFinite(Number(c.weather_code))) throw new Error("Invalid weather code");
        var code=Number(c.weather_code);
        var profile=window.izmailWeatherProfile(code,c.wind_speed_10m);
        state.weather=profile.weather;state.intensity=profile.intensity;state.wind=profile.wind;state.thunder=profile.thunder;state.hail=profile.hail;state.fog=profile.fog;
        syncRealScene();
        if(temp && isFinite(Number(c.temperature_2m))) temp.textContent=Math.round(Number(c.temperature_2m))+"°C";
        if(txt) txt.textContent=names[code]||"Погода";
        if(icon) icon.textContent=(state.time==="night" && (code===0 || code===1))?"🌙":(profile.thunder?"⛈️":icons[code]||(profile.weather==="rain"?"🌧️":profile.weather==="snow"?"❄️":"🌤️"));
      })
      .catch(function(){
        var panel=document.getElementById("weatherPanel"),txt=document.getElementById("weatherText");
        if(panel && !panel.dataset.weatherTime && txt)txt.textContent="Погода недоступна";
        if(panel && panel.dataset.weatherTime && Date.now()-Number(panel.dataset.weatherTime)*1000>7200000 && txt)txt.textContent="Данные погоды устарели";
        if(panel)panel.title="Не удалось обновить погоду. Последние данные сохранены.";
      })
      .finally(function(){weatherPending=false;});
  }
