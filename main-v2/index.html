<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=overlays-content">
<script>
(function(){
  var root=document.documentElement,initialWidth=window.innerWidth;
  function lockStage(){
    var width=window.innerWidth,height=window.innerHeight;
    root.style.setProperty('--stable-viewport-height',height+'px');
    root.style.setProperty('--stage-w',Math.min(width,height*.488,600)+'px');
    root.style.setProperty('--stage-h',Math.min(width*1.783,height*.87,1069.8)+'px');
    initialWidth=width;
  }
  lockStage();
  window.addEventListener('resize',function(){
    if(Math.abs(window.innerWidth-initialWidth)>40&&!document.activeElement?.matches('#directorySearch, .search-real, input[type="search"]'))lockStage();
  });
  window.addEventListener('orientationchange',function(){setTimeout(lockStage,300)});
})();
</script>
