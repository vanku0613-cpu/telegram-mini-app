<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Справочник Измаил — меню</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#061b35;color:#fff;
  font-family:Arial,Helvetica,sans-serif
}
body{
  background:
    radial-gradient(circle at 18% 4%,rgba(0,190,255,.16),transparent 28%),
    radial-gradient(circle at 86% 42%,rgba(0,100,255,.13),transparent 32%),
    linear-gradient(180deg,#061b35 0%,#061a34 34%,#04152c 68%,#020d20 100%);
}

/* Нижняя часть страницы. Верхняя шапка профиля остаётся отдельно. */
.menu{
  position:absolute;
  left:0;top:300px;width:100%;
  height:calc(100dvh - 300px);
  padding:6px 3.2% 5px;
  overflow:hidden;
  background:
    linear-gradient(180deg,rgba(6,27,53,.18),rgba(3,20,42,.44) 52%,rgba(2,13,32,.76)),
    radial-gradient(circle at 20% 5%,rgba(0,200,255,.08),transparent 25%);
}

/* ПОИСК + ПОДСКАЗКИ */
.search-wrap{
  position:relative;
  z-index:80;
  margin:0 0 5px;
}
.search{
  height:36px;margin:0;
  border:1.5px solid #18c5ff;border-radius:18px;
  display:flex;align-items:center;overflow:hidden;
  background:linear-gradient(180deg,rgba(12,91,157,.82),rgba(2,37,78,.96));
  box-shadow:0 0 6px rgba(0,195,255,.9),0 0 13px rgba(0,115,255,.42),inset 0 0 12px rgba(0,190,255,.14)
}
.search-icon{width:34px;flex:0 0 34px;text-align:center;font-size:24px}
.search input{
  min-width:0;flex:1;height:100%;border:0;outline:0;
  background:transparent;color:#fff;font-size:14px;font-weight:700
}
.search input::placeholder{color:#fff;opacity:.9}
.search-go{
  width:31px;height:31px;flex:0 0 35px;margin-right:5px;border-radius:50%;
  display:grid;place-items:center;background:#08baf6;color:#fff;
  font-size:22px;font-weight:700;box-shadow:0 0 10px rgba(0,220,255,.9)
}
.search-help{
  position:absolute;
  left:0;right:0;top:40px;
  padding:7px;
  border:1px solid rgba(18,196,255,.8);
  border-radius:14px;
  background:rgba(3,25,52,.97);
  box-shadow:0 8px 22px rgba(0,0,0,.5),0 0 12px rgba(0,190,255,.35);
  display:none;
}
.search-help-title{
  padding:0 5px 5px;
  font-size:9px;font-weight:800;
  color:#8fe8ff;
  text-transform:uppercase;
  letter-spacing:.4px;
}
.search-chips{
  display:flex;flex-wrap:wrap;gap:5px;
}
.search-chip{
  appearance:none;border:1px solid rgba(18,196,255,.75);
  border-radius:12px;padding:5px 8px;
  background:linear-gradient(180deg,#07518b,#063663);
  color:#fff;font-size:10px;font-weight:700;
  box-shadow:0 0 6px rgba(0,190,255,.25);
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.search-chip:active,
.search-chip.is-pressed{
  transform:translateY(1px) scale(.96);
  border-color:#fff;
  background:#087bb8;
  box-shadow:0 0 3px #fff,0 0 12px #00eaff,0 0 22px #00c8ff;
}
.search-tip{
  margin-top:6px;padding:0 5px;
  color:rgba(255,255,255,.72);
  font-size:8.5px;line-height:1.2;
}

/* 8 КНОПОК */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 6px}
.card{
  position:relative;width:100%;height:48px;min-width:0;padding:0;
  overflow:hidden;border:1.5px solid #12c4ff;border-radius:14px;
  background:#063b70;color:#fff;text-align:left;cursor:pointer;
  appearance:none;-webkit-tap-highlight-color:transparent;
  box-shadow:0 0 6px rgba(0,190,255,.95),0 0 12px rgba(0,110,255,.42),inset 0 0 12px rgba(0,180,255,.16);
  transition:transform .1s ease,filter .1s ease,box-shadow .1s ease
}
.card img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center;display:block;z-index:0
}

/* Фотография плавно переходит в фирменный синий фон */
.card .shade{
  position:absolute;inset:0;z-index:1;
  background:
    linear-gradient(180deg,rgba(2,15,34,.02) 0%,rgba(3,18,40,.12) 25%,
    rgba(3,19,41,.58) 60%,rgba(3,18,40,.94) 100%),
    linear-gradient(90deg,rgba(1,13,31,.34),rgba(1,13,31,.04))
}

/* Текст читается, но подложка остаётся прозрачной */
.card .copy{
  position:absolute;z-index:3;left:6px;right:24px;bottom:3px;
  padding:3px 7px;border-radius:9px;
  background:linear-gradient(180deg,rgba(3,28,56,.18),rgba(3,19,41,.72));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  text-shadow:0 2px 5px rgba(0,0,0,.98)
}
.card .copy strong{
  display:block;font-size:12.8px;line-height:1.05;font-weight:800;
  white-space:normal
}
.card .copy small{
  display:block;margin-top:2px;font-size:8px;line-height:1.05;font-weight:600;
  white-space:normal;overflow:hidden;text-overflow:ellipsis
}
.card .arrow{
  position:absolute;z-index:4;right:6px;top:50%;
  transform:translateY(-52%);font-size:21px;color:#fff;
  text-shadow:0 0 7px #00caff
}

/* ЯРКАЯ ВСПЫШКА КАНТИКА ПРИ НАЖАТИИ */
/* ЯВНОЕ СОСТОЯНИЕ НАЖАТИЯ: кнопка реально "прожимается" пальцем */
.card, .groups, .bottom button{
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.card:active, .groups:active, .bottom button:active,
.card.is-pressed, .groups.is-pressed, .bottom button.is-pressed{
  transform: translateY(2px) scale(.965) !important;
  filter: brightness(1.32) saturate(1.18) !important;
  border-color:#ffffff !important;
  box-shadow:
    0 0 4px #fff,
    0 0 10px #fff,
    0 0 22px #00eaff,
    0 0 38px #00bfff,
    inset 0 0 18px rgba(255,255,255,.48) !important;
}

.card.flash,
.groups.flash,
.bottom button.flash{
  animation: neonFlash .55s ease-out both;
  z-index:10;
}

@keyframes neonFlash{
  0%{
    transform:scale(.975);
    filter:brightness(1.1);
    border-color:#12c4ff;
    box-shadow:
      0 0 6px rgba(0,190,255,.95),
      0 0 12px rgba(0,110,255,.42),
      inset 0 0 12px rgba(0,180,255,.16);
  }

  18%{
    transform:scale(1.012);
    filter:brightness(1.45);
    border-color:#ffffff;
    box-shadow:
      0 0 5px #ffffff,
      0 0 12px #ffffff,
      0 0 22px #00d9ff,
      0 0 42px #00bfff,
      0 0 65px rgba(0,210,255,.95),
      inset 0 0 18px rgba(255,255,255,.45);
  }

  42%{
    transform:scale(1.018);
    filter:brightness(1.75);
    border-color:#ffffff;
    box-shadow:
      0 0 7px #ffffff,
      0 0 16px #ffffff,
      0 0 30px #3de5ff,
      0 0 55px #00c8ff,
      0 0 85px rgba(0,210,255,1),
      inset 0 0 24px rgba(255,255,255,.55);
  }

  68%{
    transform:scale(1.005);
    filter:brightness(1.35);
    border-color:#6eeaff;
    box-shadow:
      0 0 6px #ffffff,
      0 0 14px #58e7ff,
      0 0 30px #00c8ff,
      0 0 55px rgba(0,190,255,.8),
      inset 0 0 18px rgba(0,230,255,.4);
  }

  100%{
    transform:scale(1);
    filter:brightness(1);
    border-color:#12c4ff;
    box-shadow:
      0 0 6px rgba(0,190,255,.95),
      0 0 12px rgba(0,110,255,.42),
      inset 0 0 12px rgba(0,180,255,.16);
  }
}

/* Дополнительная вспышка именно КАНТА — без псевдоэлемента,
   чтобы свечение не обрезалось overflow у карточки */
.card.flash, .groups.flash, .bottom button.flash{
  outline:2px solid #ffffff;
  outline-offset:-1px;
  filter:brightness(1.5) saturate(1.15)
    drop-shadow(0 0 5px #ffffff)
    drop-shadow(0 0 14px #00eaff)
    drop-shadow(0 0 28px #00bfff) !important;
}

/* НАШИ ГРУППЫ */
.groups{
  height:43px;width:100%;margin:7px 0 0;padding:0 9px;
  display:flex;align-items:center;overflow:hidden;
  border:1.5px solid #12c4ff;border-radius:17px;color:#fff;
  background:linear-gradient(180deg,rgba(7,82,145,.96),rgba(2,38,80,.98));
  box-shadow:0 0 6px rgba(0,190,255,.9),0 0 13px rgba(0,110,255,.45),inset 0 0 13px rgba(0,180,255,.15);
  cursor:pointer
}
.groups-icon{width:32px;flex:0 0 37px;text-align:center;font-size:20px}
.groups-copy{min-width:0;flex:1;text-align:left}
.groups-copy strong{display:block;font-size:13px}
.groups-copy small{display:block;margin-top:1px;font-size:7.7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{
  width:26px;height:26px;flex:0 0 30px;margin-right:4px;border-radius:50%;
  display:grid;place-items:center;background:#08baf6;font-size:16px;
  box-shadow:0 0 10px rgba(0,220,255,.85)
}
.groups-arrow{width:17px;flex:0 0 17px;text-align:center;font-size:22px}

/* НИЖНЯЯ НАВИГАЦИЯ */
.bottom{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:6px;margin-top:5px}
.bottom button{
  height:38px;min-width:0;padding:3px 2px;
  border:1.5px solid #12c4ff;border-radius:13px;
  background:linear-gradient(180deg,rgba(8,88,153,.9),rgba(2,37,77,.97));
  box-shadow:0 0 6px rgba(0,190,255,.85),0 0 11px rgba(0,110,255,.4),inset 0 0 11px rgba(0,180,255,.14);
  color:#fff;cursor:pointer
}
.bi{display:block;font-size:16px;line-height:16px}
.bt{display:block;font-size:8.5px;line-height:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs{display:block;font-size:6px;line-height:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.88}

/* Избранное */
#fav.active .bi{color:#ffe45c;text-shadow:0 0 7px #ffe45c}
#fav.active{border-color:#ffe45c;box-shadow:0 0 8px rgba(255,228,92,.9),0 0 16px rgba(255,190,0,.35)}

.empty{
  display:none;text-align:center;font-size:11px;font-weight:700;
  padding:10px;color:rgba(255,255,255,.86)
}

@media(max-width:370px){
  .menu{padding-left:2.8%;padding-right:2.8%}
  .card{height:46px}
  .card .copy strong{font-size:12.1px}
  .card .copy small{font-size:7.5px}
  .groups{height:41px}
  .bottom button{height:36px}
}
</style>
</head>

<body>
<section class="menu" aria-label="Меню справочника">

  <div class="search-wrap">
    <div class="search">
      <div class="search-icon">⌕</div>
      <input id="q" type="search" placeholder="Поиск: телефон, адрес, услуга..." autocomplete="off" inputmode="search">
      <div class="search-go">→</div>
    </div>

    <div id="searchHelp" class="search-help">
      <div class="search-help-title">Помощник поиска</div>
      <div id="searchChips" class="search-chips"></div>
      <div class="search-tip">Ищет по названию, телефону, адресу, услуге и ключевым словам.</div>
    </div>
  </div>

  <div class="grid" id="cards">

    <button class="card" type="button"
      data-search="здоровье уход медицина аптеки красота врач клиника стоматолог анализы телефон адрес">
      <img src="menu-images/health.jpg" alt="">
      <span class="shade"></span>
      <span class="copy"><strong>Здоровье и уход</strong><small>Медицина • Аптеки • Красота</small></span>
      <span class="arrow">›</span>
    </button>

    <button class="card" type="button"
      data-search="транспорт такси автобусы перевозки маршрут водитель грузоперевозки телефон номер">
      <img src="menu-images/transport.jpg" alt="">
      <span class="shade"></span>
      <span class="copy"><strong>Транспорт / Такси</strong><small>Такси • Автобусы • Перевозки</small></span>
      <span class="arrow">›</span>
    </button>

    <button class="card" type="button"
      data-search="услуги мастера ремонт строительство специалисты сантехник электрик ремонт телефон номер">
      <img src="menu-images/services.jpg" alt="">
      <span class="shade"></span>
      <span class="copy"><strong>Услуги и мастера</strong><small>Ремонт • Строительство • Специалисты</small></span>
      <span class="arrow">›</span>
    </button>

    <button class="card" type="button"
      data-search="продукты питание магазины рынки доставка супермаркет продукты телефон адрес">
      <img src="menu-images/food.jpg" alt="">
      <span class="shade"></span>
      <span class="copy"><strong>Продукты питания</strong><small>Магазины • Рынки • Доставка</small></span>
      <span class="arrow">›</span>
    </button>

    <button class="card" type="button"
      data-search="коммунальные службы свет вода газ тепло электроэнергия водоканал газ телефон аварийная">
      <img src="menu-images/utilities.jpg" alt="">
      <span class="shade"></span>
      <span class="copy"><strong>Коммунальные службы</strong><small>Свет • Вода • Газ • Тепло</small></span>
      <span class="arrow">›</span>
    </button>

    <button class="card" type="button"
      data-search="работа вакансии резюме работа сотрудник работодатель подработка телефон">
      <img src="menu-images/jobs.jpg" alt="">
      <span class="shade"></span>
      <span class="copy"><strong>Работа / Вакансии</strong><small>Найти работу • Разместить резюме</small></span>
      <span class="arrow">›</span>
    </button>

    <button class="card" type="button"
      data-search="образование развитие школы курсы репетиторы обучение университет колледж телефон адрес">
      <img src="menu-images/education.jpg" alt="">
      <span class="shade"></span>
      <span class="copy"><strong>Образование и развитие</strong><small>Школы • Курсы • Репетиторы</small></span>
      <span class="arrow">›</span>
    </button>

    <button class="card" type="button"
      data-search="отдых жилье море базы отдыха рестораны кафе гостиницы отели аренда туризм телефон адрес">
      <img src="menu-images/rest.jpg" alt="">
      <span class="shade"></span>
      <span class="copy"><strong>Отдых • Жильё • Море</strong><small>Базы отдыха • Рестораны • Кафе</small></span>
      <span class="arrow">›</span>
    </button>

  </div>

  <div id="empty" class="empty">Ничего не найдено</div>

  <button class="groups" type="button">
    <span class="groups-icon">👥</span>
    <span class="groups-copy">
      <strong>Наши группы</strong>
      <small>Все наши Telegram-группы</small>
    </span>
    <span class="tg">➤</span>
    <span class="groups-arrow">›</span>
  </button>

  <nav class="bottom" aria-label="Нижняя навигация">
    <button type="button"><span class="bi">⌂</span><span class="bt">Главная</span></button>

    <button type="button">
      <span class="bi">📢</span>
      <span class="bt">Заказать рекламу</span>
      <span class="bs">Попасть в меню группы</span>
    </button>

    <button id="fav" type="button">
      <span class="bi">☆</span>
      <span class="bt">Избранное</span>
    </button>
  </nav>
</section>

<script>
/* =========================================================
   УНИВЕРСАЛЬНЫЙ ПОИСК + ПОМОЩНИК
   Ищет по названию, телефону, адресу, услугам и ключевым словам.
   ========================================================= */
const searchInput = document.getElementById('q');
const cards = [...document.querySelectorAll('.card')];
const empty = document.getElementById('empty');
const searchHelp = document.getElementById('searchHelp');
const searchChips = document.getElementById('searchChips');

function normalize(text){
  return String(text || '')
    .toLowerCase()
    .replace(/ё/g,'е')
    .replace(/[^\p{L}\p{N}+@._-]+/gu,' ')
    .replace(/\s+/g,' ')
    .trim();
}

/* Быстрые подсказки. Нажатие на подсказку сразу запускает поиск. */
const searchSuggestions = [
  ['📞 Телефон','телефон номер мобильный связь'],
  ['📍 Адрес','адрес улица район центр'],
  ['🚕 Такси','такси транспорт перевозки'],
  ['🏥 Врач','врач медицина клиника стоматолог аптека'],
  ['🔧 Ремонт','ремонт мастер сантехник электрик строительство'],
  ['🛒 Магазин','магазин продукты супермаркет рынок доставка'],
  ['💼 Работа','работа вакансия резюме подработка'],
  ['🍽️ Кафе','кафе ресторан еда доставка'],
  ['🏠 Жильё','жилье квартира гостиница отель аренда'],
  ['🌊 Море','море отдых база отдыха туризм']
];

function renderSearchSuggestions(){
  const query = normalize(searchInput.value);
  const suggestions = searchSuggestions
    .filter(([label, words])=>{
      if(!query) return true;
      const hay = normalize(label + ' ' + words);
      return query.split(' ').some(word=>hay.includes(word));
    })
    .slice(0,6);

  searchChips.innerHTML = suggestions.map(([label, words]) =>
    `<button class="search-chip" type="button" data-query="${words.split(' ')[0]}">${label}</button>`
  ).join('');

  searchHelp.style.display = suggestions.length ? 'block' : 'none';

  searchChips.querySelectorAll('.search-chip').forEach(chip=>{
    chip.addEventListener('pointerdown',()=>chip.classList.add('is-pressed'),{passive:true});
    chip.addEventListener('pointerup',()=>chip.classList.remove('is-pressed'),{passive:true});
    chip.addEventListener('pointercancel',()=>chip.classList.remove('is-pressed'),{passive:true});
    chip.addEventListener('click',()=>{
      searchInput.value = chip.dataset.query || '';
      doSearch();
      searchInput.focus();
    });
  });
}

function doSearch(){
  const query = normalize(searchInput.value);
  let found = 0;

  cards.forEach(card=>{
    const searchable = normalize(
      (card.dataset.search || '') + ' ' +
      card.innerText + ' ' +
      card.textContent
    );

    /* Каждое слово запроса должно встретиться в данных карточки. */
    const words = query ? query.split(' ') : [];
    const match = !query || words.every(word=>searchable.includes(word));

    card.style.display = match ? '' : 'none';
    if(match) found++;
  });

  empty.style.display = query && !found ? 'block' : 'none';
  renderSearchSuggestions();
}

searchInput.addEventListener('input',doSearch);
searchInput.addEventListener('search',doSearch);
searchInput.addEventListener('focus',renderSearchSuggestions);

document.addEventListener('pointerdown',(event)=>{
  if(!event.target.closest('.search-wrap')){
    searchHelp.style.display='none';
  }
});

renderSearchSuggestions();

/* =========================================================
   МИГАНИЕ КНОПОК
   ========================================================= */
document.querySelectorAll('.card,.groups,.bottom button').forEach(button=>{
  const pressOn=()=>button.classList.add('is-pressed');
  const pressOff=()=>button.classList.remove('is-pressed');

  button.addEventListener('pointerdown', pressOn, {passive:true});
  button.addEventListener('pointerup', pressOff, {passive:true});
  button.addEventListener('pointercancel', pressOff, {passive:true});
  button.addEventListener('pointerleave', pressOff, {passive:true});

  button.addEventListener('click',()=>{
    pressOff();
    button.classList.remove('flash');
    void button.offsetWidth;
    button.classList.add('flash');

    clearTimeout(button._flashTimer);
    button._flashTimer=setTimeout(()=>{
      button.classList.remove('flash');
    },650);
  });
});

/* =========================================================
   ИЗБРАННОЕ
   Сохраняется после закрытия/открытия страницы.
   ========================================================= */
const fav = document.getElementById('fav');
const FAV_KEY = 'spravochnik_izmail_favorite';

if(localStorage.getItem(FAV_KEY)==='1'){
  fav.classList.add('active');
  fav.querySelector('.bi').textContent='★';
}

fav.addEventListener('click',()=>{
  const active = fav.classList.toggle('active');
  fav.querySelector('.bi').textContent = active ? '★' : '☆';
  localStorage.setItem(FAV_KEY,active ? '1' : '0');
});
</script>
</body>
</html>
