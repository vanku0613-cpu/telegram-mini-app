<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#06152b">

  <title>Наши группы — Измаил</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      background: #06152b;
    }

    body {
      overflow-x: hidden;
      position: relative;
    }

    /* =========================
       ФОН ВСЕЙ СТРАНИЦЫ
       ========================= */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;

      background:
        linear-gradient(
          rgba(3, 17, 36, .58),
          rgba(3, 17, 36, .68)
        ),
        url("./a_vertical_cinematic_high_resolution_stylized_n.png")
        center top / cover no-repeat;

      transform: scale(1.01);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at 50% 25%,
          rgba(0, 180, 210, .08),
          transparent 48%
        ),
        linear-gradient(
          180deg,
          rgba(3, 15, 32, .08) 0%,
          rgba(3, 15, 32, .20) 55%,
          rgba(3, 15, 32, .48) 100%
        );
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       ОСНОВНАЯ ОБЛАСТЬ
       ========================= */

    .groups-page {
      width: 100%;
      max-width: 620px;
      min-height: 100vh;
      margin: 0 auto;

      padding:
        max(14px, env(safe-area-inset-top))
        10px
        max(14px, env(safe-area-inset-bottom));
    }

    /* =========================
       ШАПКА
       ========================= */

    .groups-header {
      width: 100%;

      /* немного спускаем шапку вниз */
      margin: 7px 0 10px;

      border-radius: 19px;
      overflow: hidden;
      position: relative;

      background: #071b35;

      border: 1px solid rgba(25, 240, 176, .70);

      box-shadow:
        0 0 18px rgba(25, 240, 176, .17),
        inset 0 0 20px rgba(0, 110, 255, .12);
    }

    .groups-header::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, .06),
          transparent 35%,
          rgba(0, 0, 0, .18)
        );
    }

    .groups-header-image {
      display: block;
      width: 100%;
      height: auto;

      aspect-ratio: 1080 / 405;

      object-fit: cover;
    }

    /* =========================
       ЗЕЛЁНАЯ КНОПКА
       СРАЗУ ПОД ШАПКОЙ
       ========================= */

    .back-btn {
      width: 100%;
      min-height: 38px;

      margin: 0;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      border: 1px solid #19f0b0;
      border-radius: 19px;

      background:
        linear-gradient(
          180deg,
          rgba(13, 119, 94, .78),
          rgba(4, 75, 61, .78)
        );

      color: #fff;

      font-size: 12.5px;
      font-weight: 800;

      box-shadow:
        0 0 13px rgba(25, 240, 176, .13),
        inset 0 1px 0 rgba(255, 255, 255, .14);

      cursor: pointer;
    }

    .back-btn:active {
      transform: scale(.985);

      background:
        rgba(11, 150, 112, .82);
    }

    .back-arrow {
      color: #19f0b0;
      font-size: 19px;
      line-height: 1;
      font-weight: 900;
    }

    /* =========================
       ГРУППЫ
       ========================= */

    .groups-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 8px;

      width: 100%;

      /* расстояние между кнопкой
         и группами */
      margin-top: 15px;
    }

    /* =========================
       КАРТОЧКА ГРУППЫ
       ========================= */

    .group-tile {
      position: relative;

      min-width: 0;
      height: 64px;

      display: flex;
      align-items: center;

      padding: 6px 7px;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          rgba(8, 31, 53, .82),
          rgba(8, 28, 49, .62) 48%,
          rgba(0, 91, 101, .25)
        );

      border: 1px solid rgba(255, 255, 255, .38);

      box-shadow:
        0 0 0 1px rgba(25, 240, 176, .13) inset,
        0 0 11px rgba(25, 240, 176, .09),
        inset 0 1px 0 rgba(255, 255, 255, .13);

      overflow: hidden;

      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);

      transition:
        transform .15s ease,
        border-color .15s ease,
        box-shadow .15s ease;
    }

    .group-tile::before {
      content: "";

      position: absolute;
      inset: 2px;

      border-radius: 13px;

      border: 1px solid rgba(25, 240, 176, .17);

      pointer-events: none;
    }

    .group-tile::after {
      content: "";

      position: absolute;

      left: -25%;
      top: -60%;

      width: 75%;
      height: 180%;

      transform: rotate(22deg);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, .07),
          transparent
        );

      pointer-events: none;
    }

    .group-tile:active {
      transform: scale(.975);

      border-color: rgba(25, 240, 176, .80);

      box-shadow:
        0 0 14px rgba(25, 240, 176, .20),
        0 0 0 1px rgba(25, 240, 176, .30) inset;
    }

    /* =========================
       ИКОНКА
       ========================= */

    .group-avatar {
      flex: 0 0 38px;

      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background:
        radial-gradient(
          circle at 35% 30%,
          rgba(255, 255, 255, .14),
          rgba(0, 70, 85, .38)
        );

      border: 1px solid rgba(25, 240, 176, .48);

      box-shadow:
        0 0 8px rgba(25, 240, 176, .12),
        inset 0 1px 0 rgba(255, 255, 255, .15);

      position: relative;
      z-index: 2;
    }

    .group-avatar svg {
      width: 21px;
      height: 21px;

      fill: #19f0b0;

      filter:
        drop-shadow(
          0 0 4px rgba(25, 240, 176, .35)
        );
    }

    /* =========================
       НАЗВАНИЕ
       ========================= */

    .group-name {
      flex: 1;
      min-width: 0;

      padding: 0 5px;

      text-align: center;

      font-size: 11.5px;
      line-height: 1.12;
      font-weight: 800;

      color: #fff;

      overflow: hidden;

      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;

      text-shadow:
        0 1px 2px rgba(0, 0, 0, .45);

      position: relative;
      z-index: 2;
    }

    /* =========================
       СТРЕЛКА
       ========================= */

    .group-arrow {
      flex: 0 0 21px;

      width: 21px;
      height: 21px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: #19f0b0;

      font-size: 19px;
      font-weight: 900;
      line-height: 1;

      background:
        rgba(25, 240, 176, .07);

      border:
        1px solid rgba(25, 240, 176, .28);

      position: relative;
      z-index: 2;
    }

    /* =========================
       НИЖНЯЯ КНОПКА
       ========================= */

    .bottom-back {
      margin-top: 12px;
    }

    /* =========================
       МАЛЕНЬКИЕ ЭКРАНЫ
       ========================= */

    @media (max-width: 380px) {

      .groups-page {
        padding-left: 7px;
        padding-right: 7px;
      }

      .groups-header {
        margin-top: 6px;
        margin-bottom: 8px;

        border-radius: 16px;
      }

      .back-btn {
        min-height: 35px;
        font-size: 11.5px;
      }

      .groups-grid {
        gap: 6px;
        margin-top: 13px;
      }

      .group-tile {
        height: 58px;
        padding: 5px;
        border-radius: 14px;
      }

      .group-avatar {
        flex-basis: 34px;
        width: 34px;
        height: 34px;
        border-radius: 10px;
      }

      .group-avatar svg {
        width: 19px;
        height: 19px;
      }

      .group-name {
        font-size: 10.5px;
        padding: 0 3px;
      }

      .group-arrow {
        flex-basis: 20px;
        width: 20px;
        height: 20px;
        font-size: 17px;
      }

      .bottom-back {
        margin-top: 10px;
      }
    }
  </style>
</head>

  <script>

    function goHome() {

      try {

        if (
          history.length > 1 &&
          document.referrer &&
          new URL(document.referrer).origin === location.origin
        ) {

          history.back();

          return;
        }

      } catch (_) {}

      location.href = "../";
    }


    (() => {

      const tg = window.Telegram?.WebApp;

      try {

        tg?.ready?.();
        tg?.expand?.();

        tg?.setHeaderColor?.("#061b35");
        tg?.setBackgroundColor?.("#061b35");

      } catch (_) {}


      document
        .querySelectorAll("a,button")
        .forEach((element) => {

          element.addEventListener("click", () => {

            try {

              tg?.HapticFeedback
                ?.impactOccurred?.("light");

            } catch (_) {}

          });

        });

    })();

  </script>
