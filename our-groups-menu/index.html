<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<meta name="theme-color" content="#061522">

<title>Мои группы</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:
    radial-gradient(
      circle at 50% -20%,
      #174e68 0,
      #0b2b3e 30%,
      #061522 65%,
      #030b12 100%
    );

  color:#fff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

.groups-page{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:16px 12px 35px;
}

.groups-header{
  margin-bottom:18px;
}

.back-button{
  display:inline-flex;
  align-items:center;
  gap:6px;

  padding:9px 15px;

  border:1px solid rgba(130,210,225,.22);
  border-radius:14px;

  background:rgba(17,48,64,.85);

  color:#fff;

  font-size:15px;
  font-weight:700;
}

.back-button span{
  font-size:26px;
  line-height:14px;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-top:18px;
}

.groups-header h1{
  margin:0;

  font-size:31px;
  line-height:1.05;
  font-weight:800;

  letter-spacing:-.7px;
}

.groups-header p{
  margin:7px 0 0;

  color:#91aab8;

  font-size:14px;
}

.telegram-mark{
  width:43px;
  height:43px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(130,220,235,.22);
  border-radius:14px;

  background:linear-gradient(145deg,#1e718e,#123f56);

  box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.telegram-mark span{
  font-size:21px;
  transform:rotate(-12deg);
}


/* КАРТОЧКИ */

.groups-grid{
  display:grid;

  grid-template-columns:repeat(2,minmax(0,1fr));

  gap:11px;
}

.group-card{
  overflow:hidden;

  border:1px solid rgba(130,205,220,.17);
  border-radius:21px;

  background:
    linear-gradient(
      145deg,
      #14384a,
      #0a2432
    );

  box-shadow:
    0 12px 25px rgba(0,0,0,.30);

  transition:.15s;
}

.group-card:active{
  transform:scale(.97);
}


/* ВЕРХ КАРТОЧКИ */

.card-visual{
  position:relative;

  height:142px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.card-visual:before{
  content:"";

  position:absolute;

  width:165px;
  height:165px;

  border-radius:50%;

  background:rgba(255,255,255,.07);
}

.visual-guide{
  background:linear-gradient(145deg,#14627d,#0b3c53);
}

.visual-zoo{
  background:linear-gradient(145deg,#19634f,#103e35);
}

.visual-auto{
  background:linear-gradient(145deg,#28658a,#173e5b);
}

.visual-home{
  background:linear-gradient(145deg,#795f43,#4d3a2b);
}

.visual-work{
  background:linear-gradient(145deg,#405f85,#293e5d);
}

.visual-market{
  background:linear-gradient(145deg,#7a632b,#493b1c);
}

.visual-energy{
  background:linear-gradient(145deg,#176173,#103e4c);
}

.visual-lost{
  background:linear-gradient(145deg,#396b70,#25474e);
}

.visual-chat{
  background:linear-gradient(145deg,#5e5285,#393251);
}


/* ОБЩИЙ ДЕКОР */

.visual-label{
  position:absolute;

  left:12px;
  bottom:9px;

  z-index:10;

  padding:4px 7px;

  border-radius:6px;

  background:rgba(0,0,0,.25);

  color:rgba(255,255,255,.65);

  font-size:8px;
  font-weight:800;

  letter-spacing:1.3px;
}
