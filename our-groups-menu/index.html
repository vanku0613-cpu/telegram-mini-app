  <!-- ВОЗВРАТ В ГЛАВНОЕ МЕНЮ -->
  <script>
    "use strict";

    function goHome() {
      try {
        if (
          history.length > 1 &&
          document.referrer &&
          new URL(document.referrer).origin === location.origin
        ) {
          history.back();
          return;
        }
      } catch (_) {}

      location.href = "../";
    }

    document
      .querySelectorAll("[data-back]")
      .forEach(function(button) {
        button.addEventListener("click", goHome);
      });
  </script>
