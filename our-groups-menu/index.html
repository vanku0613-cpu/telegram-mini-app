<!DOCTYPE html>
<html lang="ru">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Наши группы</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    :root{
      --green:#19f0b0;
      --dark:#06152b;

      --glass:rgba(5,24,43,.58);
      --glass2:rgba(7,35,55,.68);

      --text:#ffffff;

      --page-bg-image:none;
    }


    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }


    html{
      background:#06152b;
    }


    html,
    body{
      margin:0;
      padding:0;

      width:100%;
      min-height:100%;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color:var(--text);

      background:#06152b;
    }


    body{
      position:relative;

      min-height:100vh;

      overflow-x:hidden;

      padding:
        0
        10px
        14px;
    }


    /* =====================================================
       ОБЩИЙ ФОН
       ===================================================== */

    body::before{

      content:"";

      position:fixed;

      inset:0;

      z-index:0;

      pointer-events:none;

      background-image:

        linear-gradient(
          rgba(3,17,36,.34),
          rgba(3,17,36,.55)
        ),

        var(--page-bg-image);

      background-position:center center;

      background-size:cover;

      background-repeat:no-repeat;

      transform:scale(1.01);
    }


    body::after{

      content:"";

      position:fixed;

      inset:0;

      z-index:0;

      pointer-events:none;

      background:

        radial-gradient(
          circle at 50% 15%,
          rgba(25,240,176,.08),
          transparent 35%
        ),

        linear-gradient(
          to bottom,
          rgba(2,13,27,.03),
          rgba(2,13,27,.18)
        );
    }


    .page{

      width:100%;

      max-width:520px;

      margin:0 auto;

      position:relative;

      z-index:1;

      padding-top:28px;
    }


    /* =====================================================
       ШАПКА
       ===================================================== */

    .groups-header{

      width:100%;

      margin:
        8px
        0
        10px;

      padding:0;

      border-radius:20px;

      overflow:hidden;

      border:
        1px solid
        rgba(25,240,176,.62);

      background:
        rgba(3,20,37,.55);

      box-shadow:

        0 0 0 1px
        rgba(255,255,255,.07)
        inset,

        0 0 18px
        rgba(25,240,176,.13),

        0 10px 30px
        rgba(0,0,0,.28);
    }


    .groups-header-image{

      display:block;

      width:100%;

      height:auto;

      max-height:150px;

      object-fit:cover;
    }


    /* =====================================================
       КНОПКА НАЗАД
       ===================================================== */

    .back-btn{

      width:100%;

      min-height:37px;

      border:
        1px solid
        rgba(25,240,176,.9);

      border-radius:14px;

      color:#ffffff;

      background:

        linear-gradient(
          135deg,
          rgba(9,120,91,.68),
          rgba(4,70,61,.56)
        );

      display:flex;

      align-items:center;

      justify-content:center;

      gap:7px;

      padding:7px 12px;

      font-size:12px;

      font-weight:750;

      box-shadow:

        0 0 0 1px
        rgba(255,255,255,.05)
        inset,

        0 0 13px
        rgba(25,240,176,.15),

        0 7px 20px
        rgba(0,0,0,.20);

      cursor:pointer;

      backdrop-filter:blur(10px);

      -webkit-backdrop-filter:blur(10px);

      transition:

        transform .15s ease,

        background .15s ease,

        box-shadow .15s ease;
    }


    .back-btn:active{

      transform:scale(.98);

      background:

        linear-gradient(
          135deg,
          rgba(9,150,112,.72),
          rgba(4,82,68,.65)
        );

      box-shadow:

        0 0 15px
        rgba(25,240,176,.24);
    }


    .back-arrow{

      color:var(--green);

      font-size:17px;

      line-height:1;
    }


    /* =====================================================
       8 ГРУПП
       ===================================================== */

    .groups-grid{

      width:100%;

      display:grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      margin-top:17px;

      gap:8px;
    }


    /* =====================================================
       КАРТОЧКА ГРУППЫ
       ===================================================== */

    .group-card{

      position:relative;

      min-width:0;

      min-height:68px;

      display:flex;

      align-items:center;

      padding:8px 9px;

      border-radius:15px;

      text-decoration:none;

      color:#ffffff;

      background:

        linear-gradient(
          135deg,
          rgba(255,255,255,.105),
          rgba(255,255,255,.025)
        ),

        linear-gradient(
          135deg,
          var(--glass2),
          var(--glass)
        );

      border:
        1px solid
        rgba(25,240,176,.62);

      box-shadow:

        0 0 0 1px
        rgba(255,255,255,.045)
        inset,

        0 0 0 2px
        rgba(25,240,176,.07),

        0 0 12px
        rgba(25,240,176,.11),

        0 8px 20px
        rgba(0,0,0,.20);

      overflow:hidden;

      backdrop-filter:
        blur(12px)
        saturate(125%);

      -webkit-backdrop-filter:
        blur(12px)
        saturate(125%);

      transition:

        transform .15s ease,

        border-color .15s ease,

        box-shadow .15s ease;
    }


    .group-card::before{

      content:"";

      position:absolute;

      inset:3px;

      border:
        1px solid
        rgba(255,255,255,.07);

      border-radius:12px;

      pointer-events:none;
    }


    .group-card::after{

      content:"";

      position:absolute;

      width:80px;

      height:180%;

      top:-40%;

      left:-100px;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.09),
          transparent
        );

      transform:rotate(18deg);

      pointer-events:none;

      transition:
        left .45s ease;
    }


    .group-card:active{

      transform:scale(.975);

      border-color:
        rgba(25,240,176,.95);

      box-shadow:

        0 0 0 1px
        rgba(255,255,255,.06)
        inset,

        0 0 0 2px
        rgba(25,240,176,.10),

        0 0 19px
        rgba(25,240,176,.24),

        0 7px 18px
        rgba(0,0,0,.22);
    }


    .group-card:active::after{

      left:120%;
    }


    /* =====================================================
       ИКОНКИ
       ===================================================== */

    .group-avatar{

      flex:0 0 48px;

      width:48px;

      height:48px;

      display:flex;

      align-items:center;

      justify-content:center;

      border-radius:13px;

      background:

        linear-gradient(
          145deg,
          rgba(25,240,176,.18),
          rgba(2,35,49,.62)
        );

      border:
        1px solid
        rgba(25,240,176,.52);

      box-shadow:

        0 0 10px
        rgba(25,240,176,.10),

        0 0 0 1px
        rgba(255,255,255,.05)
        inset;

      color:var(--green);

      position:relative;

      z-index:1;
    }


    .group-avatar svg{

      width:30px;

      height:30px;

      stroke:currentColor;

      fill:none;

      stroke-width:1.8;

      stroke-linecap:round;

      stroke-linejoin:round;
    }


    /* =====================================================
       НАЗВАНИЕ
       ===================================================== */

    .group-name{

      flex:1;

      min-width:0;

      padding:0 5px;

      text-align:center;

      font-size:11.5px;

      line-height:1.15;

      font-weight:750;

      color:#ffffff;

      white-space:normal;

      position:relative;

      z-index:1;

      text-shadow:
        0 1px 5px
        rgba(0,0,0,.55);
    }


    /* =====================================================
       СТРЕЛКА
       ===================================================== */

    .group-arrow{

      flex:0 0 18px;

      width:18px;

      height:18px;

      display:flex;

      align-items:center;

      justify-content:center;

      color:var(--green);

      font-size:17px;

      line-height:1;

      position:relative;

      z-index:1;

      text-shadow:
        0 0 7px
        rgba(25,240,176,.35);
    }


    /* =====================================================
       БОЛЬШАЯ КНОПКА АДМИНИСТРАЦИИ
       ===================================================== */

    .admin-contact{

      display:flex;

      flex-direction:column;

      align-items:center;

      justify-content:center;

      width:100%;

      min-height:76px;

      margin-top:24px;

      padding:11px 16px;

      border:
        1px solid
        rgba(25,240,176,.78);

      border-radius:18px;

      text-decoration:none;

      color:#ffffff;

      background:

        linear-gradient(
          135deg,
          rgba(25,240,176,.13),
          rgba(255,255,255,.045)
        ),

        linear-gradient(
          135deg,
          rgba(7,35,55,.74),
          rgba(5,24,43,.64)
        );

      box-shadow:

        0 0 0 1px
        rgba(255,255,255,.06)
        inset,

        0 0 18px
        rgba(25,240,176,.16),

        0 10px 25px
        rgba(0,0,0,.25);

      backdrop-filter:
        blur(13px)
        saturate(130%);

      -webkit-backdrop-filter:
        blur(13px)
        saturate(130%);

      transition:

        transform .15s ease,

        border-color .15s ease,

        box-shadow .15s ease;
    }


    .admin-contact:active{

      transform:scale(.985);

      border-color:
        rgba(25,240,176,1);

      box-shadow:

        0 0 0 1px
        rgba(255,255,255,.08)
        inset,

        0 0 24px
        rgba(25,240,176,.28),

        0 8px 20px
        rgba(0,0,0,.25);
    }


    .admin-title{

      display:flex;

      align-items:center;

      justify-content:center;

      gap:8px;

      font-size:15px;

      line-height:1.2;

      font-weight:800;

      text-align:center;

      text-shadow:
        0 1px 6px
        rgba(0,0,0,.55);
    }


    .admin-icon{

      font-size:20px;

      line-height:1;
    }


    .admin-subtitle{

      margin-top:7px;

      font-size:10.5px;

      line-height:1.25;

      font-weight:600;

      color:rgba(255,255,255,.78);

      text-align:center;

      text-shadow:
        0 1px 4px
        rgba(0,0,0,.45);
    }


    /* =====================================================
       НИЖНЯЯ КНОПКА
       ===================================================== */

    .bottom-back{

      margin-top:18px;

      margin-bottom:2px;
    }


    /* =====================================================
       МАЛЕНЬКИЕ ЭКРАНЫ
       ===================================================== */

    @media (max-width:380px){

      body{

        padding-left:8px;

        padding-right:8px;
      }


      .page{

      }


      .groups-header{

        margin-top:5px;

        margin-bottom:8px;

        border-radius:17px;
      }


      .groups-header-image{

        max-height:125px;
      }


      .groups-grid{

        gap:7px;

        margin-top:14px;
      }


      .group-card{

        min-height:62px;

        padding:6px 6px;

        border-radius:13px;
      }


      .group-avatar{

        flex-basis:43px;

        width:43px;

        height:43px;

        border-radius:11px;
      }


      .group-avatar svg{

        width:27px;

        height:27px;
      }


      .group-name{

        font-size:10.5px;

        padding:0 3px;
      }


      .group-arrow{

        flex-basis:16px;

        width:16px;

        font-size:15px;
      }


      .admin-contact{

        min-height:72px;

        margin-top:20px;

        padding:10px 12px;

        border-radius:16px;
      }


      .admin-title{

        font-size:14px;
      }


      .admin-icon{

      }


      .admin-subtitle{

        font-size:9.5px;

        margin-top:6px;
      }


      .bottom-back{

        margin-top:17px;
      }


      .back-btn{

        min-height:34px;

        font-size:11px;

        border-radius:13px;
      }
    }

  </style>

</head>

  <script>

    /* =====================================================
       ЗАГРУЗКА ФОНА
       ===================================================== */

    (() => {

      const backgroundFile =
        "file_000000000a4c8210a764c747055f86c5.png";

      const possiblePaths = [

        "./" + backgroundFile,

        "./our-groups-menu/" + backgroundFile,

        "/our-groups-menu/" + backgroundFile

      ];


      function setBackground(path){

        document.documentElement.style
          .setProperty(
            "--page-bg-image",
            'url("' + path + '")'
          );

      }


      function tryPath(index){

        if(index >= possiblePaths.length){

          console.warn(
            "Фоновая картинка не найдена:",
            backgroundFile
          );

          return;
        }


        const image = new Image();


        image.onload = () => {

          setBackground(
            possiblePaths[index]
          );

          console.log(
            "Фон загружен:",
            possiblePaths[index]
          );

        };


        image.onerror = () => {

          tryPath(index + 1);

        };


        image.src =
          possiblePaths[index];

      }


      tryPath(0);

    })();


    /* =====================================================
       TELEGRAM MINI APP
       ===================================================== */

    (() => {

      const tg =
        window.Telegram?.WebApp;


      try{

        tg?.ready?.();

        tg?.expand?.();

        tg?.setHeaderColor?.(
          "#061b35"
        );

        tg?.setBackgroundColor?.(
          "#061b35"
        );

      }catch(_){}


      document
        .querySelectorAll("a, button")
        .forEach((element) => {

          element.addEventListener(
            "click",
            () => {

              try{

                tg
                  ?.HapticFeedback
                  ?.impactOccurred
                  ?.("light");

              }catch(_){}

            }
          );

        });

    })();


    /* =====================================================
       ВОЗВРАТ В ГЛАВНОЕ МЕНЮ
       ===================================================== */

    function goHome(){

      try{

        if(
          history.length > 1 &&
          document.referrer &&
          new URL(
            document.referrer
          ).origin === location.origin
        ){

          history.back();

          return;
        }

      }catch(_){}


      location.href = "../";

    }

  </script>
