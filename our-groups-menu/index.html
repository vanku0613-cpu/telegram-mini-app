  <script>

    (() => {

      const tg = window.Telegram?.WebApp;

      try {

        tg?.ready?.();
        tg?.expand?.();

        tg?.setHeaderColor?.("#06152b");
        tg?.setBackgroundColor?.("#06152b");

      } catch (_) {}

      document
        .querySelectorAll("a, button")
        .forEach((element) => {

          element.addEventListener("click", () => {

            try {

              tg
                ?.HapticFeedback
                ?.impactOccurred
                ?.("light");

            } catch (_) {}

          });

        });

    })();


    function goHome() {

      try {

        if (
          history.length > 1 &&
          document.referrer &&
          new URL(document.referrer).origin === location.origin
        ) {

          history.back();

          return;

        }

      } catch (_) {}

      location.href = "../";

    }

  </script>
