<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#061b35">

  <title>Наши группы — Измаил</title>

  <link rel="stylesheet" href="./styles.css">

  <!-- Запасной стиль: страница будет выглядеть нормально,
       даже если styles.css временно не загрузился -->
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #06152b;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .groups-page {
      width: 100%;
      max-width: 620px;
      min-height: 100vh;
      margin: 0 auto;
      padding:
        max(8px, env(safe-area-inset-top))
        10px
        max(12px, env(safe-area-inset-bottom));
    }

    /* =========================
       ШАПКА
       ========================= */

    .groups-header {
      width: 100%;
      margin: 0 0 8px;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      background: #071b35;
      border: 1px solid rgba(25, 240, 176, .65);
      box-shadow:
        0 0 16px rgba(25, 240, 176, .16),
        inset 0 0 18px rgba(0, 110, 255, .12);
    }

    .groups-header::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.06),
          transparent 35%,
          rgba(0,0,0,.18)
        );
    }

    .groups-header-image {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1080 / 405;
      object-fit: cover;
    }

    /* =========================
       ЗАГОЛОВОК
       ========================= */

    .groups-title {
      margin: 7px 0 6px;
      text-align: center;
      font-size: clamp(21px, 6vw, 30px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: .8px;
      color: #fff;
      text-shadow:
        0 0 5px rgba(255,255,255,.25),
        0 0 14px rgba(25,240,176,.18);
    }

    .groups-subtitle {
      margin: 0 0 8px;
      text-align: center;
      font-size: 11px;
      line-height: 1.2;
      color: rgba(220, 235, 245, .78);
    }

    /* =========================
       КНОПКА НАЗАД
       ========================= */

    .back-btn {
      width: 100%;
      min-height: 34px;
      margin: 0 0 8px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      border: 1px solid #19f0b0;
      border-radius: 17px;

      background:
        linear-gradient(
          180deg,
          rgba(13, 119, 94, .72),
          rgba(4, 75, 61, .72)
        );

      color: #fff;

      font-size: 12px;
      font-weight: 800;

      box-shadow:
        0 0 12px rgba(25,240,176,.12),
        inset 0 1px 0 rgba(255,255,255,.13);

      cursor: pointer;
    }

    .back-btn:active {
      transform: scale(.985);
      background: rgba(11, 150, 112, .8);
    }

    .back-arrow {
      color: #19f0b0;
      font-size: 18px;
      line-height: 1;
      font-weight: 900;
    }

    /* =========================
       СЕТКА ГРУПП
       ========================= */

    .groups-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      width: 100%;
    }

    /* =========================
       СТЕКЛЯННАЯ КНОПКА ГРУППЫ
       ========================= */

    .group-tile {
      position: relative;

      min-width: 0;
      height: 64px;

      display: flex;
      align-items: center;

      padding: 6px 7px;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.105),
          rgba(255,255,255,.035) 45%,
          rgba(0,90,100,.13)
        );

      border: 1px solid rgba(255,255,255,.38);

      box-shadow:
        0 0 0 1px rgba(25,240,176,.12) inset,
        0 0 10px rgba(25,240,176,.08),
        inset 0 1px 0 rgba(255,255,255,.13);

      overflow: hidden;

      transition:
        transform .15s ease,
        border-color .15s ease,
        box-shadow .15s ease;
    }

    /* тонкий зелёный внутренний кант */
    .group-tile::before {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 13px;
      border: 1px solid rgba(25,240,176,.16);
      pointer-events: none;
    }

    /* стеклянный блик */
    .group-tile::after {
      content: "";
      position: absolute;
      left: -25%;
      top: -60%;
      width: 75%;
      height: 180%;
      transform: rotate(22deg);

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.07),
        transparent
      );

      pointer-events: none;
    }

    .group-tile:active {
      transform: scale(.975);
      border-color: rgba(25,240,176,.8);

      box-shadow:
        0 0 13px rgba(25,240,176,.2),
        0 0 0 1px rgba(25,240,176,.3) inset;
    }

    /* =========================
       ИКОНКА
       ========================= */

    .group-avatar {
      flex: 0 0 38px;
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background:
        radial-gradient(
          circle at 35% 30%,
          rgba(255,255,255,.14),
          rgba(0,70,85,.38)
        );

      border: 1px solid rgba(25,240,176,.48);

      box-shadow:
        0 0 8px rgba(25,240,176,.12),
        inset 0 1px 0 rgba(255,255,255,.15);

      position: relative;
      z-index: 2;
    }

    .group-avatar svg {
      width: 21px;
      height: 21px;
      fill: #19f0b0;
      filter: drop-shadow(0 0 4px rgba(25,240,176,.35));
    }

    /* =========================
       НАЗВАНИЕ
       ========================= */

    .group-name {
      flex: 1;
      min-width: 0;

      padding: 0 5px;

      text-align: center;

      font-size: 11.5px;
      line-height: 1.12;
      font-weight: 800;

      color: #fff;

      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;

      text-shadow: 0 1px 2px rgba(0,0,0,.45);

      position: relative;
      z-index: 2;
    }

    /* =========================
       СТРЕЛКА
       ========================= */

    .group-arrow {
      flex: 0 0 21px;
      width: 21px;
      height: 21px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: #19f0b0;
      font-size: 19px;
      font-weight: 900;
      line-height: 1;

      background: rgba(25,240,176,.07);
      border: 1px solid rgba(25,240,176,.28);

      position: relative;
      z-index: 2;
    }

    /* =========================
       НИЖНЯЯ КНОПКА
       ========================= */

    .bottom-back {
      margin-top: 8px;
      margin-bottom: 0;
    }

    /* =========================
       МАЛЕНЬКИЕ ЭКРАНЫ
       ========================= */

    @media (max-width: 380px) {

      .groups-page {
        padding-left: 7px;
        padding-right: 7px;
      }

      .groups-header {
        border-radius: 15px;
        margin-bottom: 6px;
      }

      .groups-title {
        margin-top: 5px;
        margin-bottom: 4px;
        font-size: 20px;
      }

      .groups-subtitle {
        margin-bottom: 6px;
        font-size: 10px;
      }

      .back-btn {
        min-height: 31px;
        margin-bottom: 6px;
        font-size: 11px;
      }

      .groups-grid {
        gap: 5px;
      }

      .group-tile {
        height: 58px;
        padding: 5px;
        border-radius: 14px;
      }

      .group-avatar {
        flex-basis: 34px;
        width: 34px;
        height: 34px;
        border-radius: 10px;
      }

      .group-avatar svg {
        width: 19px;
        height: 19px;
      }

      .group-name {
        font-size: 10.5px;
        padding: 0 3px;
      }

      .group-arrow {
        flex-basis: 20px;
        width: 20px;
        height: 20px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="groups-page">

    <!-- =========================
         ШАПКА ИЗМАИЛА

    <div class="groups-header">
      <img
        class="groups-header-image"

    <!-- =========================

      <!-- 2. РЫНОК ОНЛАЙН -->
      <a

      >
        <span class="group-avatar">

      >
        <span class="group-avatar">

      <a

      >
        <span class="group-avatar">

    <!-- =========================
         НИЖНЯЯ КНОПКА
         ========================= -->

    <button
      class="back-btn bottom-back"
      type="button"
      onclick="goHome()"
    >
      <span class="back-arrow">←</span>
      <span>Вернуться в главное меню</span>
    </button>

  </main>


  <script>
    function goHome() {
      try {
        if (
          history.length > 1 &&
          document.referrer &&
          new URL(document.referrer).origin === location.origin
        ) {
          history.back();
          return;
        }
      } catch (_) {}

      location.href = "../";
    }


    // Лёгкая вибрация Telegram при нажатии
    (() => {
      const tg = window.Telegram?.WebApp;

      try {
        tg?.ready?.();
        tg?.expand?.();
        tg?.setHeaderColor?.("#061b35");
        tg?.setBackgroundColor?.("#061b35");
      } catch (_) {}

      document.querySelectorAll("a, button").forEach((element) => {
        element.addEventListener("click", () => {
          try {
            tg?.HapticFeedback?.impactOccurred?.("light");
          } catch (_) {}
        });
      });
    })();
  </script>

</body>
</html>
